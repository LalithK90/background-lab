<body>

  <div id="background">
    <div id="wavesStage">

      <div class="wave-scene active" id="wave-simple">
        <div class="wave-track" style="animation-duration: 14s;">
          <svg viewBox="0 0 2400 200" preserveAspectRatio="none">

              d="M0,100 C150,150 350,50 600,100 C850,150 1050,50 1200,100 L1200,200 L0,200 Z" />

        </div>
      </div>

              d="M0,110 C150,160 350,60 600,110 C850,160 1050,60 1200,110 L1200,200 L0,200 Z" />

        </div>
        <div class="wave-track wave-mid" style="animation-duration: 18s;">

            <path class="wave-foam-path" d="M1200,128 C1350,120 1550,138 1800,128 C2050,120 2250,138 2400,128" />

        </div>

      <div class="wave-scene" id="wave-gradient">
        <div class="wave-track wave-bob" style="animation-duration: 16s;">

            <defs>
              <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8b5cf6" />
                <stop offset="50%" stop-color="#ec4899" />
                <stop offset="100%" stop-color="#0ea5e9" />
              </linearGradient>
            </defs>
            <path fill="url(#waveGrad)"
              d="M0,110 C150,160 350,60 600,110 C850,160 1050,60 1200,110 L1200,200 L0,200 Z" />
            <path fill="url(#waveGrad)"
              d="M1200,110 C1350,160 1550,60 1800,110 C2050,160 2250,60 2400,110 L2400,200 L1200,200 Z" />
          </svg>
        </div>
      </div>

      <div class="wave-scene" id="wave-svg">
        <div class="wave-track" style="animation-duration: 20s;">
          <svg viewBox="0 0 2400 200" preserveAspectRatio="none">
            <path class="wave-fill c-jagged"
              d="M0,120 L100,80 L200,140 L300,60 L400,130 L500,70 L600,120 L700,90 L800,150 L900,60 L1000,130 L1100,80 L1200,110 L1200,200 L0,200 Z" />
            <path class="wave-fill c-jagged"
              d="M1200,120 L1300,80 L1400,140 L1500,60 L1600,130 L1700,70 L1800,120 L1900,90 L2000,150 L2100,60 L2200,130 L2300,80 L2400,110 L2400,200 L1200,200 Z" />
          </svg>
        </div>
      </div>

      <div class="wave-scene" id="wave-flowing">
        <canvas id="flowCanvas"></canvas>
      </div>

      <div class="wave-scene" id="wave-dynamic">
        <div id="dynamicWaveTrack" style="position:absolute; inset:0;"></div>
      </div>

    </div>
  </div>

  <main>
    <div class="content-card glass">

  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const scenes = document.querySelectorAll('.wave-scene');
    let flowRAF = null;

    // Cursor spotlight glow + click ripple burst + glass card tilt
    const spotlightEl = document.getElementById('cursorSpotlight');
    window.addEventListener('mousemove', (e) => {
      spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
      spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
      spotlightEl.classList.add('visible');
    });
    window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

    document.addEventListener('click', (e) => {
      if (reducedMotion) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    const tiltCard = document.querySelector('.content-card.glass');
    tiltCard.addEventListener('mousemove', (e) => {
      if (reducedMotion) return;
      const rect = tiltCard.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
    });
    tiltCard.addEventListener('mouseleave', () => {
      tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // Subtle background parallax that follows the cursor
    const bgEl = document.getElementById('background');
    let parMouseX = window.innerWidth / 2, parMouseY = window.innerHeight / 2;
    let parX = 0, parY = 0, parallaxRAF = null;
    window.addEventListener('mousemove', (e) => { parMouseX = e.clientX; parMouseY = e.clientY; });
    function parallaxLoop () {
      const tx = (parMouseX / window.innerWidth - 0.5) * -30;
      const ty = (parMouseY / window.innerHeight - 0.5) * -30;
      parX += (tx - parX) * 0.06;
      parY += (ty - parY) * 0.06;
      bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      parallaxRAF = requestAnimationFrame(parallaxLoop);
    }
    if (!reducedMotion) parallaxRAF = requestAnimationFrame(parallaxLoop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (parallaxRAF) { cancelAnimationFrame(parallaxRAF); parallaxRAF = null; } }
      else if (!parallaxRAF && !reducedMotion) { parallaxRAF = requestAnimationFrame(parallaxLoop); }
    });

    function setStyle (name) {
      const isDynamic = !!dynamicWaveConfigs[name];
      scenes.forEach((s) => s.classList.toggle('active', isDynamic ? s.id === 'wave-dynamic' : s.id === `wave-${name}`));
      if (isDynamic) renderDynamicWave(name);
      if (name === 'flowing') startFlow();
      else stopFlow();
    }

    // Reusable SVG wave generator for the 38 extra wave variations (color/speed/shape driven, no hand-written paths)
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function wavePathAt (offset, baseline, amp, jagged) {
      if (jagged) {
        const points = 12;
        let d = `M${offset},${baseline}`;
        for (let i = 1; i <= points; i++) {
          const x = offset + (1200 / points) * i;
          const y = baseline + (i % 2 === 0 ? amp : -amp);
          d += ` L${x},${y}`;
        }
        d += ` L${offset + 1200},200 L${offset},200 Z`;
        return d;
      }
      const p1 = baseline - amp;
      const p2 = baseline + amp;
      return `M${offset},${baseline} C${offset + 150},${p2} ${offset + 350},${p1} ${offset + 600},${baseline} C${offset + 850},${p2} ${offset + 1050},${p1} ${offset + 1200},${baseline} L${offset + 1200},200 L${offset},200 Z`;
    }

    const dynamicWaveConfigs = {
      equalizerBars: { layers: [ { baseline: 150, amp: 40, jagged: true, color: '#22d3ee', duration: 4, height: 60, opacity: 0.9 } ] },
      skylineSilhouette: { layers: [ { baseline: 130, amp: 50, jagged: true, color: '#1e293b', duration: 40, height: 70, opacity: 0.9 } ] },
      neonWaveGrid: { layers: [ { baseline: 120, amp: 30, jagged: false, color: '#22d3ee', duration: 10, height: 40, opacity: 0.8 }, { baseline: 140, amp: 25, jagged: false, color: '#f472b6', duration: 14, height: 30, opacity: 0.6 } ] },
      interactiveWave: { layers: [ { baseline: 120, amp: 35, jagged: false, color: '#38bdf8', duration: 12, height: 45, opacity: 0.8 } ], interactive: true },
      ribbonWave: { layers: [ { baseline: 130, amp: 60, jagged: false, color: '#a78bfa', duration: 18, height: 20, opacity: 0.7 } ] },
      particleWave: { layers: [ { baseline: 140, amp: 12, jagged: true, color: '#f8fafc', duration: 8, height: 25, opacity: 0.6 } ] },
      tidalWave: { layers: [ { baseline: 110, amp: 70, jagged: false, color: '#0ea5e9', duration: 8, height: 55, opacity: 0.9 } ] },
      calmSeaWave: { layers: [ { baseline: 140, amp: 15, jagged: false, color: '#38bdf8', duration: 30, height: 35, opacity: 0.6 } ] },
      stormWave: { layers: [ { baseline: 110, amp: 65, jagged: true, color: '#334155', duration: 6, height: 60, opacity: 0.9 }, { baseline: 130, amp: 50, jagged: true, color: '#1e293b', duration: 8, height: 45, opacity: 0.7 } ] },
      desertDuneWave: { layers: [ { baseline: 130, amp: 40, jagged: false, color: '#d97706', duration: 34, height: 55, opacity: 0.8 } ] },
      silkWave: { layers: [ { baseline: 130, amp: 35, jagged: false, color: '#f9a8d4', duration: 20, height: 40, opacity: 0.55 } ] },
      soundWavePulse: { layers: [ { baseline: 140, amp: 45, jagged: true, color: '#a855f7', duration: 5, height: 50, opacity: 0.85 } ] },
      retroGridHorizon: { layers: [ { baseline: 150, amp: 20, jagged: false, color: '#ec4899', duration: 16, height: 35, opacity: 0.7 } ] },
      auroraWave: { layers: [ { baseline: 120, amp: 40, jagged: false, color: '#34d399', duration: 22, height: 50, opacity: 0.6 }, { baseline: 140, amp: 30, jagged: false, color: '#22d3ee', duration: 26, height: 35, opacity: 0.5 } ] },
      moltenWave: { layers: [ { baseline: 120, amp: 45, jagged: false, color: '#f97316', duration: 9, height: 55, opacity: 0.85 } ] },
      glacierWave: { layers: [ { baseline: 130, amp: 25, jagged: false, color: '#93c5fd', duration: 28, height: 45, opacity: 0.7 } ] },
      sunsetHorizonWave: { layers: [ { baseline: 130, amp: 35, jagged: false, color: '#fb923c', duration: 20, height: 45, opacity: 0.75 } ] },
      underwaterWave: { layers: [ { baseline: 120, amp: 30, jagged: false, color: '#0e7490', duration: 24, height: 60, opacity: 0.65 } ] },
      windRipple: { layers: [ { baseline: 145, amp: 10, jagged: false, color: '#94a3b8', duration: 6, height: 25, opacity: 0.5 } ] },
      heartbeatWave: { layers: [ { baseline: 130, amp: 55, jagged: true, color: '#ef4444', duration: 3, height: 40, opacity: 0.85 } ] },
      radioFrequencyWave: { layers: [ { baseline: 130, amp: 40, jagged: true, color: '#38bdf8', duration: 7, height: 40, opacity: 0.7 } ] },
      cosmicWave: { layers: [ { baseline: 120, amp: 35, jagged: false, color: '#6366f1', duration: 20, height: 50, opacity: 0.6 }, { baseline: 140, amp: 25, jagged: false, color: '#a855f7', duration: 24, height: 35, opacity: 0.5 } ] },
      paperFoldWave: { layers: [ { baseline: 130, amp: 45, jagged: true, color: '#e2e8f0', duration: 16, height: 45, opacity: 0.5 } ] },
      fabricDrapeWave: { layers: [ { baseline: 130, amp: 30, jagged: false, color: '#c4b5fd', duration: 22, height: 45, opacity: 0.55 } ] },
      lavaFlowWave: { layers: [ { baseline: 120, amp: 40, jagged: false, color: '#dc2626', duration: 12, height: 55, opacity: 0.85 } ] },
      inkWave: { layers: [ { baseline: 130, amp: 35, jagged: false, color: '#1e293b', duration: 18, height: 50, opacity: 0.8 } ] },
      crystalWave: { layers: [ { baseline: 130, amp: 35, jagged: true, color: '#a5f3fc', duration: 14, height: 40, opacity: 0.6 } ] },
      bambooWave: { layers: [ { baseline: 135, amp: 20, jagged: true, color: '#84cc16', duration: 18, height: 35, opacity: 0.6 } ] },
      mercuryWave: { layers: [ { baseline: 130, amp: 25, jagged: false, color: '#cbd5e1', duration: 10, height: 40, opacity: 0.7 } ] },
      northernWave: { layers: [ { baseline: 120, amp: 35, jagged: false, color: '#22d3ee', duration: 20, height: 50, opacity: 0.6 }, { baseline: 140, amp: 25, jagged: false, color: '#34d399', duration: 24, height: 35, opacity: 0.5 } ] },
      coralWave: { layers: [ { baseline: 130, amp: 30, jagged: false, color: '#fb7185', duration: 16, height: 45, opacity: 0.7 } ] },
      staticInterferenceWave: { layers: [ { baseline: 130, amp: 50, jagged: true, color: '#94a3b8', duration: 2, height: 50, opacity: 0.6 } ] },
      doubleHelixWave: { layers: [ { baseline: 110, amp: 35, jagged: false, color: '#818cf8', duration: 14, height: 40, opacity: 0.7 }, { baseline: 150, amp: 35, jagged: false, color: '#f472b6', duration: 14, height: 40, opacity: 0.7 } ] },
      mountainRangeWave: { layers: [ { baseline: 110, amp: 60, jagged: true, color: '#475569', duration: 30, height: 70, opacity: 0.9 } ] },
      riverCurrentWave: { layers: [ { baseline: 135, amp: 20, jagged: false, color: '#0ea5e9', duration: 9, height: 35, opacity: 0.7 } ] },
      sineGridWave: { layers: [ { baseline: 130, amp: 30, jagged: false, color: '#38bdf8', duration: 12, height: 40, opacity: 0.6 }, { baseline: 130, amp: 30, jagged: false, color: '#38bdf8', duration: 20, height: 40, opacity: 0.3 } ] },
      reactiveBeatWave: { layers: [ { baseline: 130, amp: 50, jagged: true, color: '#facc15', duration: 1.5, height: 45, opacity: 0.85 } ] },
      desertMirageWave: { layers: [ { baseline: 140, amp: 15, jagged: false, color: '#fde68a', duration: 26, height: 30, opacity: 0.5 } ] }
    };

    function renderDynamicWave (name) {
      const cfg = dynamicWaveConfigs[name];
      const track = document.getElementById('dynamicWaveTrack');
      track.innerHTML = '';
      cfg.layers.forEach((layer) => {
        const wrap = document.createElement('div');
        wrap.className = 'wave-track';
        wrap.style.position = 'absolute';
        wrap.style.bottom = '0';
        wrap.style.left = '0';
        wrap.style.width = '200%';
        wrap.style.height = `${layer.height}%`;
        wrap.style.opacity = reducedMotion ? '1' : layer.opacity;
        wrap.style.animationName = 'wave-scroll';
        wrap.style.animationTimingFunction = 'linear';
        wrap.style.animationIterationCount = 'infinite';
        wrap.style.animationDuration = `${layer.duration}s`;

        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 2400 200');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.display = 'block';

        [ 0, 1200 ].forEach((offset) => {
          const path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', wavePathAt(offset, layer.baseline, layer.amp, layer.jagged));
          path.setAttribute('fill', layer.color);
          svg.appendChild(path);
        });

        wrap.appendChild(svg);
        track.appendChild(wrap);
      });
    }

    document.getElementById('styleSelector').addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      setStyle(btn.dataset.style);
    });

    // Interactive Wave: amplitude reacts to mouse Y position
    window.addEventListener('mousemove', (e) => {
      if (!document.getElementById('wave-dynamic').classList.contains('active')) return;
      const active = document.querySelector('.style-btn.active');
      if (!active || active.dataset.style !== 'interactiveWave') return;
      const ratio = 1 - e.clientY / window.innerHeight;
      const track = document.getElementById('dynamicWaveTrack');
      const svgEl = track.querySelector('svg');
      if (svgEl) svgEl.style.transform = `scaleY(${(0.6 + ratio * 0.8).toFixed(2)})`;
    });

    // Canvas flowing wave
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = 0, height = 0, t = 0;

    function resizeCanvas () {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawFlow () {
      ctx.clearRect(0, 0, width, height);
      const layers = [
        { amp: 30, freq: 0.006, speed: 0.015, color: 'rgba(56, 189, 248, 0.35)', yOffset: 0.55 },
        { amp: 22, freq: 0.010, speed: 0.022, color: 'rgba(139, 92, 246, 0.35)', yOffset: 0.65 },
        { amp: 16, freq: 0.014, speed: 0.03, color: 'rgba(236, 72, 153, 0.35)', yOffset: 0.75 }
      ];
      layers.forEach((layer) => {
        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 8) {
          const y = height * layer.yOffset + Math.sin(x * layer.freq + t * layer.speed) * layer.amp;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = layer.color;
        ctx.fill();
      });
      t += 1;
    }

    function flowLoop () {
      drawFlow();
      flowRAF = requestAnimationFrame(flowLoop);
    }

    function startFlow () {
      if (flowRAF || reducedMotion) { if (reducedMotion) drawFlow(); return; }
      resizeCanvas();
      flowLoop();
    }

    function stopFlow () {
      if (flowRAF) { cancelAnimationFrame(flowRAF); flowRAF = null; }
    }

    window.addEventListener('resize', () => { if (document.getElementById('wave-flowing').classList.contains('active')) resizeCanvas(); });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopFlow();
      else if (document.getElementById('wave-flowing').classList.contains('active')) startFlow();
    });
  </script>
</body>

</html>

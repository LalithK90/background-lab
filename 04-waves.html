  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const scenes = document.querySelectorAll('.wave-scene');
    let flowRAF = null;

    // Cursor spotlight glow + click ripple burst + glass card tilt
    const spotlightEl = document.getElementById('cursorSpotlight');
    window.addEventListener('mousemove', (e) => {
      spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
      spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
      spotlightEl.classList.add('visible');
    });
    window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

    document.addEventListener('click', (e) => {
      if (reducedMotion) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    const tiltCard = document.querySelector('.content-card.glass');
    tiltCard.addEventListener('mousemove', (e) => {
      if (reducedMotion) return;
      const rect = tiltCard.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
    });
    tiltCard.addEventListener('mouseleave', () => {
      tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // Subtle background parallax that follows the cursor
    const bgEl = document.getElementById('background');
    let parMouseX = window.innerWidth / 2, parMouseY = window.innerHeight / 2;
    let parX = 0, parY = 0, parallaxRAF = null;
    window.addEventListener('mousemove', (e) => { parMouseX = e.clientX; parMouseY = e.clientY; });
    function parallaxLoop () {
      const tx = (parMouseX / window.innerWidth - 0.5) * -30;
      const ty = (parMouseY / window.innerHeight - 0.5) * -30;
      parX += (tx - parX) * 0.06;
      parY += (ty - parY) * 0.06;
      bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      parallaxRAF = requestAnimationFrame(parallaxLoop);
    }
    if (!reducedMotion) parallaxRAF = requestAnimationFrame(parallaxLoop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (parallaxRAF) { cancelAnimationFrame(parallaxRAF); parallaxRAF = null; } }
      else if (!parallaxRAF && !reducedMotion) { parallaxRAF = requestAnimationFrame(parallaxLoop); }
    });

    function setStyle (name) {
      const isDynamic = !!dynamicWaveConfigs[ name ];
      scenes.forEach((s) => s.classList.toggle('active', isDynamic ? s.id === 'wave-dynamic' : s.id === `wave-${name}`));
      if (isDynamic) renderDynamicWave(name);
      if (name === 'flowing') startFlow();
      else stopFlow();
    }

    // Reusable SVG wave generator for the 38 extra wave variations (color/speed/shape driven, no hand-written paths)
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function wavePathAt (offset, baseline, amp, jagged) {
      if (jagged) {
        const points = 12;
        let d = `M${offset},${baseline}`;
        for (let i = 1; i <= points; i++) {
          const x = offset + (1200 / points) * i;
          const y = baseline + (i % 2 === 0 ? amp : -amp);
          d += ` L${x},${y}`;
        }
        d += ` L${offset + 1200},200 L${offset},200 Z`;
        return d;
      }
      const p1 = baseline - amp;
      const p2 = baseline + amp;
      return `M${offset},${baseline} C${offset + 150},${p2} ${offset + 350},${p1} ${offset + 600},${baseline} C${offset + 850},${p2} ${offset + 1050},${p1} ${offset + 1200},${baseline} L${offset + 1200},200 L${offset},200 Z`;
    }

    function renderDynamicWave (name) {
      const cfg = dynamicWaveConfigs[ name ];
      const track = document.getElementById('dynamicWaveTrack');
      track.innerHTML = '';
      cfg.layers.forEach((layer) => {
        const wrap = document.createElement('div');
        wrap.className = 'wave-track';
        wrap.style.position = 'absolute';
        wrap.style.bottom = '0';
        wrap.style.left = '0';
        wrap.style.width = '200%';
        wrap.style.height = `${layer.height}%`;
        wrap.style.opacity = reducedMotion ? '1' : layer.opacity;
        wrap.style.animationName = 'wave-scroll';
        wrap.style.animationTimingFunction = 'linear';
        wrap.style.animationIterationCount = 'infinite';
        wrap.style.animationDuration = `${layer.duration}s`;

        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 2400 200');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.display = 'block';

        [ 0, 1200 ].forEach((offset) => {
          const path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', wavePathAt(offset, layer.baseline, layer.amp, layer.jagged));
          path.setAttribute('fill', layer.color);
          svg.appendChild(path);
        });

        wrap.appendChild(svg);
        track.appendChild(wrap);
      });
    }

    document.getElementById('styleSelector').addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      setStyle(btn.dataset.style);
    });

    // Interactive Wave: amplitude reacts to mouse Y position
    window.addEventListener('mousemove', (e) => {
      if (!document.getElementById('wave-dynamic').classList.contains('active')) return;
      const active = document.querySelector('.style-btn.active');
      if (!active || active.dataset.style !== 'interactiveWave') return;
      const ratio = 1 - e.clientY / window.innerHeight;
      const track = document.getElementById('dynamicWaveTrack');
      const svgEl = track.querySelector('svg');
      if (svgEl) svgEl.style.transform = `scaleY(${(0.6 + ratio * 0.8).toFixed(2)})`;
    });

    // Canvas flowing wave
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = 0, height = 0, t = 0;

    function resizeCanvas () {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawFlow () {
      ctx.clearRect(0, 0, width, height);
      const layers = [
        { amp: 30, freq: 0.006, speed: 0.015, color: 'rgba(56, 189, 248, 0.35)', yOffset: 0.55 },
        { amp: 22, freq: 0.010, speed: 0.022, color: 'rgba(139, 92, 246, 0.35)', yOffset: 0.65 },
        { amp: 16, freq: 0.014, speed: 0.03, color: 'rgba(236, 72, 153, 0.35)', yOffset: 0.75 }
      ];
      layers.forEach((layer) => {
        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 8) {
          const y = height * layer.yOffset + Math.sin(x * layer.freq + t * layer.speed) * layer.amp;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = layer.color;
        ctx.fill();
      });
      t += window.BackgroundLabSpeed || 1;
    }

    function flowLoop () {
      drawFlow();
      flowRAF = requestAnimationFrame(flowLoop);
    }

    function startFlow () {
      if (flowRAF || reducedMotion) { if (reducedMotion) drawFlow(); return; }
      resizeCanvas();
      flowLoop();
    }

    function stopFlow () {
      if (flowRAF) { cancelAnimationFrame(flowRAF); flowRAF = null; }
    }

    window.addEventListener('resize', () => { if (document.getElementById('wave-flowing').classList.contains('active')) resizeCanvas(); });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopFlow();
      else if (document.getElementById('wave-flowing').classList.contains('active')) startFlow();
    });
  </script>
  <script>
    (() => {
      const cssFile = '04-waves.css';
      const selector = document.getElementById('styleSelector');
      const drawer = document.getElementById('codeDrawer');
      const output = document.getElementById('generatedHtml');
      const status = document.getElementById('copyStatus');
      const tint = document.getElementById('customTint');
      const background = document.getElementById('background');
      const defaults = { tint: '#ffffff', mix: 0, speed: 1, brightness: 1, amplitude: 1 };
      const limits = { mix: [ 0, 0.75 ], speed: [ 0.25, 2.5 ], brightness: [ 0.5, 1.5 ], amplitude: [ 0.5, 1.8 ] };
      const clamp = (value, key) => Math.min(limits[ key ][ 1 ], Math.max(limits[ key ][ 0 ], Number(value)));
      const initial = (() => { try { return JSON.parse(document.body.dataset.exportState || 'null'); } catch { return null; } })();
      let style = selector.querySelector('.style-btn.active').dataset.style;
      const requested = initial && selector.querySelector(`.style-btn[data-style="${CSS.escape(initial.style)}"]`);
      if (requested) requested.click();
      if (requested) style = requested.dataset.style;
      let settings = { ...defaults };

      function apply () {
        tint.style.backgroundColor = settings.tint;
        tint.style.opacity = String(settings.mix);
        background.style.filter = settings.brightness === 1 ? '' : `brightness(${settings.brightness})`;
        const activeWave = document.querySelector('.wave-scene.active');
        if (activeWave) {
          activeWave.style.transformOrigin = '50% 50%';
          activeWave.style.transform = settings.amplitude === 1 ? '' : `scaleY(${settings.amplitude})`;
        }
        window.BackgroundLabSpeed = settings.speed;
        document.getAnimations().forEach((animation) => {
          if (animation.effect && animation.effect.getTiming().iterations === Infinity) animation.playbackRate = settings.speed;
        });
        document.body.dataset.exportState = JSON.stringify({ schemaVersion: 1, style, settings });
      }

      function renderControls () {
        const controls = document.getElementById('parameterControls'); controls.innerHTML = '';
        document.getElementById('selectedStyleName').textContent = selector.querySelector('.style-btn.active').textContent;
        [ { key: 'tint', label: 'Color tint', type: 'color' }, { key: 'mix', label: 'Tint strength', type: 'range', min: 0, max: 0.75, step: 0.01 }, { key: 'speed', label: 'Animation speed', type: 'range', min: 0.25, max: 2.5, step: 0.05 }, { key: 'brightness', label: 'Brightness', type: 'range', min: 0.5, max: 1.5, step: 0.05 }, { key: 'amplitude', label: 'Wave amplitude', type: 'range', min: 0.5, max: 1.8, step: 0.05 } ].forEach((spec) => {
          const label = document.createElement('label'); label.className = spec.type === 'range' ? 'code-control code-control--range' : 'code-control'; label.htmlFor = `drawer-${spec.key}`;
          const title = document.createElement('span'); title.textContent = spec.label;
          const input = document.createElement('input'); input.id = `drawer-${spec.key}`; input.type = spec.type; input.value = settings[ spec.key ];
          if (spec.type === 'range') { input.min = spec.min; input.max = spec.max; input.step = spec.step; }
          let valueOutput = null;
          const update = () => { settings[ spec.key ] = spec.type === 'color' ? input.value : clamp(input.value, spec.key); if (spec.key === 'tint' && settings.mix === 0) { settings.mix = 0.2; const strength = document.getElementById('drawer-mix'); if (strength) { strength.value = '0.2'; strength.closest('label').querySelector('output').value = '0.20'; } } if (valueOutput) valueOutput.value = Number(settings[ spec.key ]).toFixed(2); apply(); refresh(); };
          if (spec.type === 'range') { valueOutput = document.createElement('output'); valueOutput.value = Number(settings[ spec.key ]).toFixed(2); title.append(' ', valueOutput); input.addEventListener('input', update); }
          else input.addEventListener('input', update);
          label.append(title, input); controls.appendChild(label);
        });
      }

      function buildHtml () {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('body').dataset.exportState = JSON.stringify({ schemaVersion: 1, style, settings });
        clone.querySelector('#codeDrawer').removeAttribute('open'); clone.querySelector('#openCodeDrawer').setAttribute('aria-expanded', 'false');
        clone.querySelector('#generatedHtml').textContent = ''; clone.querySelector('#copyStatus').textContent = '';
        clone.querySelectorAll('.click-ripple').forEach((node) => node.remove()); clone.querySelector('#cursorSpotlight').classList.remove('visible');
        const sheet = Array.from(document.styleSheets).find((item) => item.href ? item.href.endsWith(`/${cssFile}`) : item.ownerNode && item.ownerNode.dataset.exportedStyles === cssFile);
        if (!sheet) throw new Error('Page stylesheet was not found.');
        const styleTag = document.createElement('style'); styleTag.dataset.exportedStyles = cssFile; styleTag.textContent = Array.from(sheet.cssRules, (rule) => rule.cssText).join('\n');
        const link = clone.querySelector(`link[rel="stylesheet"][href$="${cssFile}"]`);
        const existingStyle = clone.querySelector(`style[data-exported-styles="${cssFile}"]`);
        if (link) link.replaceWith(styleTag); else if (existingStyle) existingStyle.replaceWith(styleTag); else clone.querySelector('head').appendChild(styleTag);
        return `<!doctype html>\n${clone.outerHTML}`;
      }

      function refresh () { try { output.value = buildHtml(); status.textContent = ''; } catch (error) { output.value = ''; status.textContent = `Could not generate HTML: ${error.message}`; } }
      selector.addEventListener('click', (event) => { const button = event.target.closest('.style-btn'); if (!button) return; style = button.dataset.style; settings = { ...defaults }; renderControls(); apply(); if (drawer.open) refresh(); });
      document.getElementById('openCodeDrawer').addEventListener('click', () => { renderControls(); apply(); drawer.showModal(); document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'true'); document.getElementById('codeDrawerTitle').focus(); refresh(); });
      const close = () => { if (drawer.open) drawer.close(); document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false'); document.getElementById('openCodeDrawer').focus(); };
      document.getElementById('closeCodeDrawer').addEventListener('click', close); drawer.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.preventDefault(); close(); } }); drawer.addEventListener('click', (event) => { if (event.target === drawer) close(); });
      drawer.addEventListener('close', () => document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false'));
      document.getElementById('copyFullHtml').addEventListener('click', async () => { refresh(); if (!output.value) return; try { await navigator.clipboard.writeText(output.value); status.textContent = 'Full HTML copied.'; } catch { output.focus(); output.select(); status.textContent = 'Clipboard unavailable. The HTML is selected; copy it manually.'; } });
      settings = { ...defaults, ...(initial && initial.style === style ? initial.settings : {}) };
      if (!/^#[0-9a-f]{6}$/i.test(settings.tint)) settings.tint = defaults.tint;
      Object.keys(limits).forEach((key) => { if (!Number.isFinite(Number(settings[ key ]))) settings[ key ] = defaults[ key ]; else settings[ key ] = clamp(settings[ key ], key); });
      renderControls(); apply();
    })();
  </script>

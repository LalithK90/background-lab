  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    (() => {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const canvas = document.getElementById('glCanvas');
      const container = document.getElementById('background');

      // Cursor spotlight glow + click ripple burst + glass card tilt
      const spotlightEl = document.getElementById('cursorSpotlight');
      window.addEventListener('mousemove', (e) => {
        spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
        spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
        spotlightEl.classList.add('visible');
      });
      window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

      document.addEventListener('click', (e) => {
        if (reducedMotion) return;
        const ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        ripple.style.left = `${e.clientX}px`;
        ripple.style.top = `${e.clientY}px`;
        document.body.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      });

      const tiltCard = document.querySelector('.content-card.glass');
      tiltCard.addEventListener('mousemove', (e) => {
        if (reducedMotion) return;
        const rect = tiltCard.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
      });
      tiltCard.addEventListener('mouseleave', () => {
        tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
      });

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const vertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `;

      const shaders = {
        gradientShader: `
      varying vec2 vUv;
      uniform float u_time;
      void main() {
        vec2 uv = vUv;
        vec3 colorA = vec3(0.13, 0.09, 0.45);
        vec3 colorB = vec3(0.86, 0.28, 0.55);
        float mixVal = uv.y + 0.15 * sin(uv.x * 3.0 + u_time * 0.4);
        vec3 col = mix(colorA, colorB, clamp(mixVal, 0.0, 1.0));
        gl_FragColor = vec4(col, 1.0);
      }
    `,
        noiseShader: `
      varying vec2 vUv;
      uniform float u_time;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
      float valueNoise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        float a = hash(i), b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }
      void main() {
        vec2 uv = vUv * 4.0;
        float n = valueNoise(uv + u_time * 0.15);
        n += 0.5 * valueNoise(uv * 2.0 - u_time * 0.1);
        vec3 col = mix(vec3(0.02, 0.02, 0.08), vec3(0.3, 0.6, 0.9), n * 0.6);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
        liquidShader: `
      varying vec2 vUv;
      uniform float u_time;
      void main() {
        vec2 p = vUv * 3.0;
        for (int i = 0; i < 3; i++) {
          p += vec2(sin(p.y + u_time * 0.5), cos(p.x + u_time * 0.4)) * 0.35;
        }
        float pattern = sin(p.x + p.y);
        vec3 col = mix(vec3(0.05, 0.1, 0.3), vec3(0.9, 0.3, 0.7), pattern * 0.5 + 0.5);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
        waveShader: `
      varying vec2 vUv;
      uniform float u_time;
      void main() {
        vec2 uv = vUv;
        float wave = sin(uv.x * 10.0 + u_time * 1.5) * 0.05 + sin(uv.x * 4.0 - u_time * 0.8) * 0.08;
        float d = smoothstep(0.02, 0.0, abs(uv.y - 0.5 - wave));
        vec3 base = mix(vec3(0.02, 0.02, 0.08), vec3(0.05, 0.15, 0.35), uv.y);
        vec3 col = mix(base, vec3(0.3, 0.7, 1.0), d);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
        blobsShader: `
      varying vec2 vUv;
      uniform float u_time;
      uniform vec2 u_resolution;
      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }
      void main() {
        vec2 uv = (vUv - 0.5) * 2.0;
        uv.x *= u_resolution.x / u_resolution.y;
        float d1 = length(uv - vec2(sin(u_time * 0.6) * 0.5, cos(u_time * 0.5) * 0.3)) - 0.3;
        float d2 = length(uv - vec2(cos(u_time * 0.4) * 0.4, sin(u_time * 0.7) * 0.4)) - 0.25;
        float d3 = length(uv - vec2(sin(u_time * 0.3 + 1.0) * 0.3, cos(u_time * 0.6 + 2.0) * 0.35)) - 0.28;
        float d = smin(smin(d1, d2, 0.3), d3, 0.3);
        float glow = smoothstep(0.05, -0.05, d);
        vec3 col = mix(vec3(0.03, 0.02, 0.08), vec3(0.5, 0.3, 0.9), glow);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
        mouseShader: `
      varying vec2 vUv;
      uniform float u_time;
      uniform vec2 u_mouse;
      void main() {
        vec2 uv = vUv;
        float dist = distance(uv, u_mouse);
        float ripple = sin(dist * 30.0 - u_time * 3.0) * 0.5 + 0.5;
        float falloff = smoothstep(0.6, 0.0, dist);
        vec3 col = mix(vec3(0.02, 0.02, 0.08), vec3(0.1, 0.7, 0.9), ripple * falloff);
        col += vec3(0.2, 0.1, 0.4) * (1.0 - falloff) * 0.3;
        gl_FragColor = vec4(col, 1.0);
      }
    `
      };

      const proceduralFragmentShader = `
        varying vec2 vUv;
        uniform float u_time;
        uniform float u_speed;
        uniform float u_scale;
        uniform int u_effect;
        uniform vec2 u_mouse;
        uniform vec2 u_resolution;
        uniform vec3 u_colorA;
        uniform vec3 u_colorB;
        uniform vec3 u_colorC;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float weight = 0.5;
          for (int i = 0; i < 4; i++) {
            value += noise(p) * weight;
            p *= 2.03;
            weight *= 0.5;
          }
          return value;
        }

        void main() {
          vec2 uv = vUv;
          vec2 p = (uv - 0.5) * vec2(u_resolution.x / u_resolution.y, 1.0);
          float time = u_time * u_speed;
          vec3 color = u_colorA;
          float n = 0.0;

          if (u_effect == 0) {
            float bands = sin(p.x * 4.0 + sin(p.y * 3.0 + time) + time) * 0.5 + 0.5;
            float curtain = smoothstep(0.0, 0.7, bands) * (0.35 + 0.65 * fbm(p * 2.0 + time * 0.15));
            color = mix(u_colorA, u_colorB, curtain);
            color = mix(color, u_colorC, smoothstep(0.65, 1.0, curtain));
          } else if (u_effect == 1) {
            vec2 grid = uv * vec2(95.0, 55.0);
            vec2 cell = floor(grid);
            vec2 local = fract(grid) - 0.5;
            float star = smoothstep(0.12, 0.0, length(local - (vec2(hash(cell), hash(cell + 3.1)) - 0.5)));
            float twinkle = 0.35 + 0.65 * sin(time * 2.0 + hash(cell) * 30.0);
            color = mix(u_colorA, u_colorB, star * twinkle);
          } else if (u_effect == 2) {
            float d1 = length(p - vec2(sin(time) * 0.35, cos(time * 0.7) * 0.2)) - 0.28;
            float d2 = length(p - vec2(cos(time * 0.8) * 0.32, sin(time * 0.6) * 0.28)) - 0.24;
            float d3 = length(p + vec2(sin(time * 0.5) * 0.25, cos(time) * 0.3)) - 0.22;
            float blob = 1.0 - smoothstep(0.0, 0.08, min(d1, min(d2, d3)));
            color = mix(u_colorA, u_colorB, blob);
            color += u_colorC * pow(max(blob, 0.0), 5.0) * 0.35;
          } else if (u_effect == 3) {
            vec2 q = p * u_scale + vec2(time * 0.08, 0.0);
            float cells = noise(q * 3.0 + fbm(q) * 2.0);
            float lines = smoothstep(0.38, 0.48, abs(cells - 0.5));
            color = mix(u_colorA, u_colorB, cells);
            color = mix(color, u_colorC, lines * 0.45);
          } else if (u_effect == 4) {
            float a = sin(p.x * 8.0 + sin(p.y * 5.0 + time) * 1.2);
            float b = cos(p.y * 9.0 - time * 0.7 + sin(p.x * 4.0));
            float caustic = pow(max(0.0, 1.0 - abs(a * b)), 4.0);
            color = mix(u_colorA, u_colorB, uv.y * 0.7 + 0.15);
            color += u_colorC * caustic * 0.8;
          } else if (u_effect == 5) {
            float plasma = sin(p.x * 5.0 + time) + sin(p.y * 6.0 - time * 0.8) + sin((p.x + p.y) * 4.0 + time * 0.5);
            float blend = plasma * 0.166 + 0.5;
            color = mix(u_colorA, u_colorB, blend);
            color = mix(color, u_colorC, smoothstep(0.62, 0.94, blend));
          } else if (u_effect == 6) {
            float swirl = fbm(p * u_scale + vec2(time * 0.13, -time * 0.08));
            float vein = sin((p.x + p.y + swirl * 2.5) * 8.0);
            float marble = smoothstep(-0.35, 0.45, vein);
            color = mix(u_colorA, u_colorB, marble);
            color = mix(color, u_colorC, smoothstep(0.82, 1.0, swirl));
          } else if (u_effect == 7) {
            float bend = fbm(p * 3.0 + time * 0.1);
            vec2 lens = p + (uv - u_mouse) * (0.12 + bend * 0.08);
            float sheen = 0.5 + 0.5 * sin((lens.x - lens.y) * 9.0 + bend * 8.0);
            color = mix(u_colorA, u_colorB, sheen);
            color = mix(color, u_colorC, pow(max(0.0, 1.0 - length(p) * 0.7), 4.0));
          } else if (u_effect == 8) {
            vec2 q = p * u_scale;
            vec2 cell = floor(q);
            float nearest = 10.0;
            float second = 10.0;
            for (int x = -1; x <= 1; x++) {
              for (int y = -1; y <= 1; y++) {
                vec2 neighbor = vec2(float(x), float(y));
                vec2 point = neighbor + vec2(hash(cell + neighbor), hash(cell + neighbor + 8.2));
                float d = length(neighbor + point - fract(q));
                if (d < nearest) { second = nearest; nearest = d; }
                else if (d < second) { second = d; }
              }
            }
            color = mix(u_colorA, u_colorB, nearest);
            color += u_colorC * (1.0 - smoothstep(0.0, 0.08, second - nearest));
          } else if (u_effect == 9) {
            vec2 q = p * u_scale;
            float grid = min(abs(fract(q.x) - 0.5), abs(fract(q.y) - 0.5));
            float glow = 0.015 / max(grid, 0.002);
            float wave = 0.5 + 0.5 * sin(q.x * 2.0 + q.y * 1.5 + time);
            color = u_colorA + u_colorB * min(glow, 1.0) * wave;
          } else if (u_effect == 10) {
            vec2 z = (uv - 0.5) * 3.0;
            vec2 c = z + vec2(-0.55 + sin(time * 0.07) * 0.08, 0.0);
            float iter = 0.0;
            for (int i = 0; i < 24; i++) {
              if (dot(z, z) > 16.0) break;
              z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
              iter += 1.0;
            }
            float shade = iter / 24.0;
            color = mix(u_colorA, u_colorB, shade);
            color = mix(color, u_colorC, smoothstep(0.25, 0.8, shade));
          } else if (u_effect == 11) {
            vec2 q = vec2(p.x * 3.0, p.y * 2.0 + time * 0.25);
            float flame = fbm(q + vec2(0.0, -time * 0.3));
            float heat = smoothstep(0.05, 0.9, flame - p.y * 0.35);
            color = mix(u_colorA, u_colorB, heat);
            color = mix(color, u_colorC, smoothstep(0.55, 0.9, heat));
          } else if (u_effect == 12) {
            float cloud = fbm(p * u_scale + vec2(time * 0.06, -time * 0.08));
            float stars = pow(hash(floor(uv * 110.0)), 18.0);
            color = mix(u_colorA, u_colorB, smoothstep(0.15, 0.85, cloud));
            color += u_colorC * stars * 1.8;
          } else if (u_effect == 13) {
            vec2 q = uv * vec2(55.0, 32.0);
            vec2 cell = floor(q);
            float dots = pow(hash(cell), 18.0);
            float wave = 0.5 + 0.5 * sin(length(p) * 12.0 - time * 1.5);
            color = mix(u_colorA, u_colorB, dots * wave);
          } else if (u_effect == 14) {
            float ring = abs(length(p) - (0.18 + 0.05 * sin(time)));
            float ripple = 0.012 / max(ring, 0.003);
            color = u_colorA + u_colorB * min(ripple, 1.0);
            color += u_colorC * (0.5 + 0.5 * sin(ring * 60.0 - time * 2.0)) * exp(-ring * 4.0);
          } else if (u_effect == 15) {
            float angle = atan(p.y, p.x);
            float r = length(p);
            float pattern = sin(angle * 8.0 + time * 0.4) * cos(r * 12.0 - time);
            color = mix(u_colorA, u_colorB, pattern * 0.5 + 0.5);
            color = mix(color, u_colorC, smoothstep(0.8, 1.0, abs(pattern)));
          } else if (u_effect == 16) {
            float fog = fbm(p * 2.0 + vec2(time * 0.05, time * 0.08));
            float density = smoothstep(0.18, 0.78, fog - p.y * 0.15);
            color = mix(u_colorA, u_colorB, density);
            color += u_colorC * density * (0.25 + 0.25 * sin(p.x * 5.0 + time));
          } else if (u_effect == 17) {
            float a = atan(p.y, p.x);
            float r = length(p);
            float arms = sin(a * 3.0 - r * 8.0 + time * 0.25);
            float stars = pow(hash(floor(uv * 90.0)), 22.0);
            color = mix(u_colorA, u_colorB, smoothstep(-0.2, 0.7, arms) * exp(-r * 0.6));
            color += u_colorC * stars;
          } else if (u_effect == 18) {
            float field = sin(p.x * 8.0 + fbm(p * 3.0 + time * 0.1) * 5.0);
            float lines = 0.025 / max(abs(field), 0.008);
            color = u_colorA + u_colorB * min(lines, 1.0);
            color += u_colorC * exp(-length(p - (u_mouse - 0.5) * 2.0) * 3.0);
          } else {
            float pattern = fbm(p * u_scale + time * 0.08);
            color = mix(u_colorA, u_colorB, pattern);
            color = mix(color, u_colorC, smoothstep(0.45, 0.9, pattern));
          }

          float vignette = smoothstep(1.35, 0.18, length(p));
          color *= 0.72 + vignette * 0.28;
          gl_FragColor = vec4(color, 1.0);
        }
      `;

      const effectStyles = {};
      const effectGroups = [
        [ 0, 0.55, 2.5, [ '#071a23', '#26d7b7', '#a7f3d0' ], [ 'auroraShader', 'auroraRibbonShader' ] ],
        [ 1, 0.7, 1.0, [ '#020617', '#dbeafe', '#fef3c7' ], [ 'starfieldShader', 'deepSpaceShader', 'starNurseryShader' ] ],
        [ 2, 0.35, 1.0, [ '#050816', '#8b5cf6', '#22d3ee' ], [ 'metaballShader', 'raymarchedSphere', 'refractiveGlassSphere' ] ],
        [ 3, 0.5, 3.0, [ '#081426', '#38bdf8', '#dbeafe' ], [ 'voronoiShader', 'fractalNoiseShader', 'cellularGrowthShader', 'quantumFieldShader' ] ],
        [ 4, 0.5, 2.0, [ '#031b2a', '#0284c7', '#67e8f9' ], [ 'causticsShader', 'oceanSurfaceShader', 'waterRippleShader' ] ],
        [ 5, 0.8, 3.0, [ '#18052d', '#ec4899', '#22d3ee' ], [ 'plasmaStormShader', 'interferencePatternShader', 'electricFieldShader' ] ],
        [ 6, 0.45, 3.2, [ '#111827', '#e2e8f0', '#64748b' ], [ 'marbleShader', 'liquidMetalShader', 'ripplingSilkShader' ] ],
        [ 7, 0.35, 2.4, [ '#07111d', '#7dd3fc', '#f0abfc' ], [ 'glassRefractionShader', 'chromaticAberrationShader', 'iridescentShader', 'metallicSheenShader' ] ],
        [ 8, 0.4, 5.0, [ '#07101e', '#a5f3fc', '#f8fafc' ], [ 'crystalShader', 'prismLightShader' ] ],
        [ 9, 0.65, 7.0, [ '#07051b', '#22d3ee', '#f472b6' ], [ 'hologramShader', 'neonGridShader' ] ],
        [ 10, 0.2, 1.0, [ '#080617', '#f472b6', '#facc15' ], [ 'mandelbrotZoom', 'kaleidoscopeShader' ] ],
        [ 11, 0.55, 2.4, [ '#160502', '#f97316', '#fde047' ], [ 'firePlasmaShader', 'lavaShader', 'magmaFlowShader' ] ],
        [ 12, 0.25, 2.2, [ '#09071e', '#7c3aed', '#f0abfc' ], [ 'nebulaShader', 'smokeShader', 'volumetricFogShader' ] ],
        [ 13, 0.45, 2.8, [ '#030817', '#38bdf8', '#f8fafc' ], [ 'particleCloudShader', 'binaryStarShader' ] ],
        [ 14, 0.7, 2.5, [ '#03111b', '#0ea5e9', '#a5f3fc' ], [ 'distortionRippleShader' ] ],
        [ 15, 0.4, 1.2, [ '#09051a', '#a78bfa', '#f472b6' ], [ 'galaxySpiralShader' ] ],
        [ 16, 0.3, 2.0, [ '#101827', '#94a3b8', '#cbd5e1' ], [ 'terrainHeightShader', 'sunsetSkyShader' ] ],
        [ 17, 0.35, 1.0, [ '#030714', '#f97316', '#fef3c7' ], [ 'smokeShader' ] ],
        [ 18, 0.55, 4.0, [ '#080617', '#a855f7', '#22d3ee' ], [ 'tunnelWarpShader' ] ]
      ];
      effectGroups.forEach(([ effect, speed, scale, colors, names ]) => {
        names.forEach((name) => { effectStyles[ name ] = { effect, speed, scale, colors }; });
      });

      const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(1, 1) },
        u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
        u_effect: { value: 0 },
        u_speed: { value: 0.5 },
        u_scale: { value: 2.5 },
        u_colorA: { value: new THREE.Color('#071a23') },
        u_colorB: { value: new THREE.Color('#26d7b7') },
        u_colorC: { value: new THREE.Color('#a7f3d0') }
      };

      window.BackgroundLabGetShaderScale = () => uniforms.u_scale.value;
      window.BackgroundLabSetShaderScale = (scale) => { uniforms.u_scale.value = scale; };

      let material = null;
      let mesh = null;

      function setShader (name) {
        if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); material.dispose(); }
        const style = effectStyles[ name ];
        if (style) {
          uniforms.u_effect.value = style.effect;
          uniforms.u_speed.value = style.speed;
          uniforms.u_scale.value = style.scale;
          uniforms.u_colorA.value.set(style.colors[ 0 ]);
          uniforms.u_colorB.value.set(style.colors[ 1 ]);
          uniforms.u_colorC.value.set(style.colors[ 2 ]);
        }
        material = new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader: style ? proceduralFragmentShader : shaders[ name ],
          uniforms
        });
        const geometry = new THREE.PlaneGeometry(2, 2);
        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
      }

      function resize () {
        const w = container.clientWidth;
        const h = container.clientHeight;
        renderer.setSize(w, h, false);
        uniforms.u_resolution.value.set(w, h);
      }

      // Subtle background parallax that follows the cursor, alongside the shader's own mouse uniform
      let parX = 0, parY = 0;
      function updateParallax () {
        const tx = (uniforms.u_mouse.value.x - 0.5) * -30;
        const ty = (uniforms.u_mouse.value.y - 0.5) * 30;
        parX += (tx - parX) * 0.06;
        parY += (ty - parY) * 0.06;
        container.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        uniforms.u_mouse.value.set(e.clientX / window.innerWidth, 1 - e.clientY / window.innerHeight);
      });

      let rafId = null;
      let previousFrameTime = performance.now();
      let shaderTime = 0;

      function loop (now) {
        const elapsed = Math.min(now - previousFrameTime, 100);
        previousFrameTime = now;
        shaderTime += elapsed / 1000 * (window.BackgroundLabSpeed || 1);
        uniforms.u_time.value = shaderTime;
        if (!reducedMotion) updateParallax();
        renderer.render(scene, camera);
        rafId = requestAnimationFrame(loop);
      }

      function start () {
        resize();
        if (rafId) cancelAnimationFrame(rafId);
        if (reducedMotion) { renderer.render(scene, camera); return; }
        previousFrameTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }

      document.getElementById('styleSelector').addEventListener('click', (e) => {
        const btn = e.target.closest('.style-btn');
        if (!btn) return;
        document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        setShader(btn.dataset.style);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
        else if (!rafId && !reducedMotion) { previousFrameTime = performance.now(); rafId = requestAnimationFrame(loop); }
      });

      setShader('gradientShader');
      start();
    })();
  </script>
  <script>
    (() => {
      const cssFile = '07-webgl.css';
      const selector = document.getElementById('styleSelector');
      const drawer = document.getElementById('codeDrawer');
      const output = document.getElementById('generatedHtml');
      const status = document.getElementById('copyStatus');
      const tint = document.getElementById('customTint');
      const background = document.getElementById('background');
      const defaults = { tint: '#ffffff', mix: 0, speed: 1, brightness: 1, scale: 2.5 };
      const limits = { mix: [ 0, 0.75 ], speed: [ 0.25, 2.5 ], brightness: [ 0.5, 1.5 ], scale: [ 0.5, 8 ] };
      const clamp = (value, key) => Math.min(limits[ key ][ 1 ], Math.max(limits[ key ][ 0 ], Number(value)));
      const initial = (() => { try { return JSON.parse(document.body.dataset.exportState || 'null'); } catch { return null; } })();
      let style = selector.querySelector('.style-btn.active').dataset.style;
      const requested = initial && selector.querySelector(`.style-btn[data-style="${CSS.escape(initial.style)}"]`);
      if (requested) requested.click();
      if (requested) style = requested.dataset.style;
      defaults.scale = window.BackgroundLabGetShaderScale ? window.BackgroundLabGetShaderScale() : defaults.scale;
      let settings = { ...defaults };
      function apply () {
        tint.style.backgroundColor = settings.tint; tint.style.opacity = String(settings.mix);
        background.style.filter = settings.brightness === 1 ? '' : `brightness(${settings.brightness})`;
        if (window.BackgroundLabSetShaderScale) window.BackgroundLabSetShaderScale(settings.scale);
        window.BackgroundLabSpeed = settings.speed;
        document.getAnimations().forEach((animation) => { if (animation.effect && animation.effect.getTiming().iterations === Infinity) animation.playbackRate = settings.speed; });
        document.body.dataset.exportState = JSON.stringify({ schemaVersion: 1, style, settings });
      }
      function renderControls () {
        const controls = document.getElementById('parameterControls'); controls.innerHTML = '';
        document.getElementById('selectedStyleName').textContent = selector.querySelector('.style-btn.active').textContent;
        [ { key: 'tint', label: 'Color tint', type: 'color' }, { key: 'mix', label: 'Tint strength', type: 'range', min: 0, max: 0.75, step: 0.01 }, { key: 'speed', label: 'Animation speed', type: 'range', min: 0.25, max: 2.5, step: 0.05 }, { key: 'brightness', label: 'Brightness', type: 'range', min: 0.5, max: 1.5, step: 0.05 }, { key: 'scale', label: 'Shader scale', type: 'range', min: 0.5, max: 8, step: 0.1 } ].forEach((spec) => {
          const label = document.createElement('label'); label.className = spec.type === 'range' ? 'code-control code-control--range' : 'code-control'; label.htmlFor = `drawer-${spec.key}`;
          const title = document.createElement('span'); title.textContent = spec.label;
          const input = document.createElement('input'); input.id = `drawer-${spec.key}`; input.type = spec.type; input.value = settings[ spec.key ];
          if (spec.type === 'range') { input.min = spec.min; input.max = spec.max; input.step = spec.step; }
          let valueOutput = null;
          const update = () => { settings[ spec.key ] = spec.type === 'color' ? input.value : clamp(input.value, spec.key); if (spec.key === 'tint' && settings.mix === 0) { settings.mix = 0.2; const strength = document.getElementById('drawer-mix'); if (strength) { strength.value = '0.2'; strength.closest('label').querySelector('output').value = '0.20'; } } if (valueOutput) valueOutput.value = Number(settings[ spec.key ]).toFixed(2); apply(); refresh(); };
          if (spec.type === 'range') { valueOutput = document.createElement('output'); valueOutput.value = Number(settings[ spec.key ]).toFixed(2); title.append(' ', valueOutput); }
          input.addEventListener('input', update); label.append(title, input); controls.appendChild(label);
        });
      }
      function buildHtml () {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('body').dataset.exportState = JSON.stringify({ schemaVersion: 1, style, settings });
        clone.querySelector('#codeDrawer').removeAttribute('open'); clone.querySelector('#openCodeDrawer').setAttribute('aria-expanded', 'false');
        clone.querySelector('#generatedHtml').textContent = ''; clone.querySelector('#copyStatus').textContent = '';
        clone.querySelectorAll('.click-ripple').forEach((node) => node.remove()); clone.querySelector('#cursorSpotlight').classList.remove('visible');
        const sheet = Array.from(document.styleSheets).find((item) => item.href ? item.href.endsWith(`/${cssFile}`) : item.ownerNode && item.ownerNode.dataset.exportedStyles === cssFile);
        if (!sheet) throw new Error('Page stylesheet was not found.');
        const styleTag = document.createElement('style'); styleTag.dataset.exportedStyles = cssFile; styleTag.textContent = Array.from(sheet.cssRules, (rule) => rule.cssText).join('\n');
        const link = clone.querySelector(`link[rel="stylesheet"][href$="${cssFile}"]`);
        const existingStyle = clone.querySelector(`style[data-exported-styles="${cssFile}"]`);
        if (link) link.replaceWith(styleTag); else if (existingStyle) existingStyle.replaceWith(styleTag); else clone.querySelector('head').appendChild(styleTag);
        return `<!doctype html>\n${clone.outerHTML}`;
      }
      function refresh () { try { output.value = buildHtml(); status.textContent = ''; } catch (error) { output.value = ''; status.textContent = `Could not generate HTML: ${error.message}`; } }
      selector.addEventListener('click', (event) => { const button = event.target.closest('.style-btn'); if (!button) return; style = button.dataset.style; defaults.scale = window.BackgroundLabGetShaderScale ? window.BackgroundLabGetShaderScale() : defaults.scale; settings = { ...defaults }; renderControls(); apply(); if (drawer.open) refresh(); });
      document.getElementById('openCodeDrawer').addEventListener('click', () => { renderControls(); apply(); drawer.showModal(); document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'true'); document.getElementById('codeDrawerTitle').focus(); refresh(); });
      const close = () => { if (drawer.open) drawer.close(); document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false'); document.getElementById('openCodeDrawer').focus(); };
      document.getElementById('closeCodeDrawer').addEventListener('click', close); drawer.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.preventDefault(); close(); } }); drawer.addEventListener('click', (event) => { if (event.target === drawer) close(); });
      drawer.addEventListener('close', () => document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false'));
      document.getElementById('copyFullHtml').addEventListener('click', async () => { refresh(); if (!output.value) return; try { await navigator.clipboard.writeText(output.value); status.textContent = 'Full HTML copied.'; } catch { output.focus(); output.select(); status.textContent = 'Clipboard unavailable. The HTML is selected; copy it manually.'; } });
      settings = { ...defaults, ...(initial && initial.style === style ? initial.settings : {}) };
      if (!/^#[0-9a-f]{6}$/i.test(settings.tint)) settings.tint = defaults.tint;
      Object.keys(limits).forEach((key) => { if (!Number.isFinite(Number(settings[ key ]))) settings[ key ] = defaults[ key ]; else settings[ key ] = clamp(settings[ key ], key); });
      renderControls(); apply();
    })();
  </script>

  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Cursor spotlight glow + click ripple burst + glass card tilt
    const spotlightEl = document.getElementById('cursorSpotlight');
    window.addEventListener('mousemove', (e) => {
      spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
      spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
      spotlightEl.classList.add('visible');
    });
    window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

    document.addEventListener('click', (e) => {
      if (reducedMotion) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    const tiltCard = document.querySelector('.content-card.glass');
    tiltCard.addEventListener('mousemove', (e) => {
      if (reducedMotion) return;
      const rect = tiltCard.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
    });
    tiltCard.addEventListener('mouseleave', () => {
      tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // Subtle background parallax that follows the cursor, on top of each style's own interactivity
    const bgEl = document.getElementById('background');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let parX = 0, parY = 0, parallaxRAF = null;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    function parallaxLoop () {
      const tx = (mouseX / window.innerWidth - 0.5) * -30;
      const ty = (mouseY / window.innerHeight - 0.5) * -30;
      parX += (tx - parX) * 0.06;
      parY += (ty - parY) * 0.06;
      bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      parallaxRAF = requestAnimationFrame(parallaxLoop);
    }
    if (!reducedMotion) parallaxRAF = requestAnimationFrame(parallaxLoop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (parallaxRAF) { cancelAnimationFrame(parallaxRAF); parallaxRAF = null; } }
      else if (!parallaxRAF && !reducedMotion) { parallaxRAF = requestAnimationFrame(parallaxLoop); }
    });

    const codeDrawer = document.getElementById('codeDrawer');

    const amountInput = document.getElementById('particleAmount');
    const opacityInput = document.getElementById('particleOpacity');
    let updateTimer = null;
    let currentContainer = null;

    function readInitialExportState () {
      try {
        const state = JSON.parse(document.body.dataset.exportState || 'null');
        return state && configs[ state.style ] ? state : null;
      } catch {
        return null;
      }
    }

    function asNumber (value, fallback) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (value && typeof value === 'object') {
        const min = Number(value.min);
        const max = Number(value.max);
        if (Number.isFinite(min) && Number.isFinite(max)) return (min + max) / 2;
      }
      return fallback;
    }

    function asColor (value, fallback) {
      const candidate = Array.isArray(value) ? value[ 0 ] : value;
      return typeof candidate === 'string' && /^#[0-9a-f]{6}$/i.test(candidate) ? candidate : fallback;
    }

    function getStyleDefaults (name) {
      const config = configs[ name ];
      return {
        background: asColor(config.background && config.background.color, '#0a0a12'),
        color: asColor(config.particles.color && config.particles.color.value, '#ffffff'),
        speed: asNumber(config.particles.move && config.particles.move.speed, 1),
        amount: config.particles.number.value,
        opacity: asNumber(config.particles.opacity && config.particles.opacity.value, 0.75)
      };
    }

    function clamp (value, min, max, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
    }

    function readSettings (style, input) {
      const defaults = getStyleDefaults(style);
      return {
        background: asColor(input && input.background, defaults.background),
        color: asColor(input && input.color, defaults.color),
        speed: clamp(input && input.speed, 0.1, 16, defaults.speed),
        amount: Math.round(clamp(input && input.amount, 10, 300, defaults.amount)),
        opacity: clamp(input && input.opacity, 0.1, 1, defaults.opacity)
      };
    }

    function serializeExportState (style, settings) {
      const state = { schemaVersion: 1, style, settings };
      document.body.dataset.exportState = JSON.stringify(state);
      return state;

    let currentSettings = readSettings(currentStyle, initialExportState && initialExportState.settings);

    function syncStyleButtons () {
      document.querySelectorAll('.style-btn').forEach((button) => {
        button.classList.toggle('active', button.dataset.style === currentStyle);
      });
    }

    function syncControls () {
      document.getElementById('selectedStyleName').textContent = document.querySelector(`.style-btn[data-style="${currentStyle}"]`).textContent;
      document.getElementById('particleBackgroundColor').value = currentSettings.background;
      document.getElementById('particleColor').value = currentSettings.color;
      speedInput.value = currentSettings.speed;
      amountInput.value = currentSettings.amount;
      opacityInput.value = currentSettings.opacity;
      document.getElementById('particleSpeedValue').value = currentSettings.speed.toFixed(1);
      document.getElementById('particleAmountValue').value = String(currentSettings.amount);
      document.getElementById('particleOpacityValue').value = currentSettings.opacity.toFixed(2);
    }

    async function loadStyle (name, settings = currentSettings) {
      if (!configs[ name ]) return;
      currentStyle = name;
      currentSettings = readSettings(name, settings);
      syncStyleButtons();
      syncControls();
      serializeExportState(currentStyle, currentSettings);

      if (currentContainer) {
        await currentContainer.destroy();
        currentContainer = null;
      }

      const options = JSON.parse(JSON.stringify(configs[ name ]));
      options.background.color = currentSettings.background;
      options.particles.number.value = currentSettings.amount;
      options.particles.color.value = currentSettings.color;
      options.particles.opacity = options.particles.opacity || {};
      options.particles.opacity.value = currentSettings.opacity;
      if (options.particles.links && options.particles.links.enable) {
        options.particles.links.color = currentSettings.color;
      }
      if (options.particles.move && options.particles.move.enable) {
        options.particles.move.speed = currentSettings.speed;
      }

      document.getElementById('tsparticles').classList.toggle('glow', name === 'neon');
      currentContainer = await tsParticles.load({ id: 'tsparticles', options });
      if (document.hidden && currentContainer) currentContainer.pause();
      if (codeDrawer.open) refreshGeneratedHtml();
    }

    function readControls () {
      return {
        background: document.getElementById('particleBackgroundColor').value,
        color: document.getElementById('particleColor').value,
        speed: speedInput.value,
        amount: amountInput.value,
        opacity: opacityInput.value
      };
    }

    function stylesheetText () {
      const sheet = Array.from(document.styleSheets).find((item) => item.href ? item.href.endsWith('/01-particles.css') : item.ownerNode && item.ownerNode.dataset.exportedStyles === '01-particles.css');
      if (!sheet) throw new Error('The page stylesheet was not found.');
      return Array.from(sheet.cssRules, (rule) => rule.cssText).join('\n');
    }

    function buildExportHtml () {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('body').dataset.exportState = JSON.stringify({ schemaVersion: 1, style: currentStyle, settings: currentSettings });
      const drawer = clone.querySelector('#codeDrawer');
      drawer.removeAttribute('open');
      clone.querySelector('#openCodeDrawer').setAttribute('aria-expanded', 'false');
      clone.querySelector('#generatedHtml').textContent = '';
      clone.querySelector('#copyStatus').textContent = '';
      clone.querySelector('#cursorSpotlight').classList.remove('visible');

      const inlineStyle = document.createElement('style');
      inlineStyle.dataset.exportedStyles = '01-particles.css';
      inlineStyle.textContent = stylesheetText();
      const stylesheetLink = clone.querySelector('link[rel="stylesheet"][href$="01-particles.css"]');
      const existingStyle = clone.querySelector('style[data-exported-styles="01-particles.css"]');
      if (stylesheetLink) stylesheetLink.replaceWith(inlineStyle);
      else if (existingStyle) existingStyle.replaceWith(inlineStyle);
      else clone.querySelector('head').appendChild(inlineStyle);
      return `<!doctype html>\n${clone.outerHTML}`;
    }

    function refreshGeneratedHtml () {
      try {
        generatedHtml.value = buildExportHtml();
        codeStatus.textContent = '';
      } catch (error) {
        generatedHtml.value = '';
        codeStatus.textContent = `Could not generate HTML: ${error.message}`;
      }
    }

    document.getElementById('openCodeDrawer').addEventListener('click', () => {
      syncControls();
      codeDrawer.showModal();

    function closeCodeDrawer () {
      if (codeDrawer.open) codeDrawer.close();
      document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false');

    }

    document.getElementById('closeCodeDrawer').addEventListener('click', closeCodeDrawer);
    codeDrawer.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.preventDefault(); closeCodeDrawer(); } });
    codeDrawer.addEventListener('click', (event) => {
      if (event.target === codeDrawer) closeCodeDrawer();
    });
    codeDrawer.addEventListener('close', () => {
      document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false');
    });

    function queueSettingsUpdate () {
      currentSettings = readSettings(currentStyle, readControls());
      syncControls();
      serializeExportState(currentStyle, currentSettings);

      clearTimeout(updateTimer);
      updateTimer = setTimeout(() => loadStyle(currentStyle, currentSettings), 100);
    }

    [ 'particleBackgroundColor', 'particleColor', 'particleSpeed', 'particleAmount', 'particleOpacity' ].forEach((id) => {
      document.getElementById(id).addEventListener('input', queueSettingsUpdate);
    });

    document.getElementById('styleSelector').addEventListener('click', (event) => {

      clearTimeout(updateTimer);

        codeStatus.textContent = 'Full HTML copied.';
      } catch {
        generatedHtml.focus();
        generatedHtml.select();
        codeStatus.textContent = 'Clipboard access is unavailable. The HTML is selected; copy it manually.';
      }
    });

    document.addEventListener('visibilitychange', () => {
      const instance = currentContainer || tsParticles.domItem(0);
      if (!instance) return;
      if (document.hidden) instance.pause();
      else instance.play();
    });

    syncStyleButtons();
    syncControls();
    loadStyle(currentStyle, currentSettings);
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Lab — Particles</title>
  <link rel="stylesheet" href="01-particles.css" />
</head>

<body>

  <div id="background">
    <div id="tsparticles"></div>
  </div>
  <div id="cursorSpotlight"></div>

  <nav class="navbar">
    <div class="nav-brand">Background Lab</div>
    <div class="nav-links">
      <a href="01-particles.html" class="active">Particles</a>
      <a href="02-aurora.html">Aurora</a>
      <a href="03-gradient.html">Gradient</a>
      <a href="04-waves.html">Waves</a>
      <a href="05-fluid.html">Fluid</a>
      <a href="06-canvas.html">Canvas</a>
      <a href="07-webgl.html">WebGL</a>
    </div>
  </nav>

  <main>
    <div class="content-card glass">
      <h1>Background Laboratory</h1>
      <p class="subtitle">Explore modern animated backgrounds</p>
      <p class="tag">Particles • tsParticles</p>
      <button class="btn-demo">View Demo</button>
    </div>

    <div class="style-selector" id="styleSelector">
      <button class="style-btn active" data-style="classic">Classic</button>
      <button class="style-btn" data-style="network">Network</button>
      <button class="style-btn" data-style="snow">Snow</button>
      <button class="style-btn" data-style="bubble">Bubble</button>
      <button class="style-btn" data-style="galaxy">Galaxy</button>
      <button class="style-btn" data-style="neon">Neon</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Cursor spotlight glow + click ripple burst + glass card tilt
    const spotlightEl = document.getElementById('cursorSpotlight');
    window.addEventListener('mousemove', (e) => {
      spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
      spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
      spotlightEl.classList.add('visible');
    });
    window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

    document.addEventListener('click', (e) => {
      if (reducedMotion) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    const tiltCard = document.querySelector('.content-card.glass');
    tiltCard.addEventListener('mousemove', (e) => {
      if (reducedMotion) return;
      const rect = tiltCard.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
    });
    tiltCard.addEventListener('mouseleave', () => {
      tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // Subtle background parallax that follows the cursor, on top of each style's own interactivity
    const bgEl = document.getElementById('background');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let parX = 0, parY = 0, parallaxRAF = null;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    function parallaxLoop () {
      const tx = (mouseX / window.innerWidth - 0.5) * -30;
      const ty = (mouseY / window.innerHeight - 0.5) * -30;
      parX += (tx - parX) * 0.06;
      parY += (ty - parY) * 0.06;
      bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      parallaxRAF = requestAnimationFrame(parallaxLoop);
    }
    if (!reducedMotion) parallaxRAF = requestAnimationFrame(parallaxLoop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (parallaxRAF) { cancelAnimationFrame(parallaxRAF); parallaxRAF = null; } }
      else if (!parallaxRAF && !reducedMotion) { parallaxRAF = requestAnimationFrame(parallaxLoop); }
    });

    const configs = {
      classic: {
        background: { color: 'transparent' },
        fpsLimit: 60,
        particles: {
          number: { value: 60, density: { enable: true, area: 900 } },
          color: { value: '#ffffff' },
          opacity: { value: 0.6 },
          size: { value: { min: 1, max: 3 } },
          links: { enable: true, distance: 130, color: '#ffffff', opacity: 0.15, width: 1 },
          move: { enable: !reducedMotion, speed: 0.6, outModes: { default: 'out' } }
        },
        detectRetina: true
      },
      network: {
        background: { color: '#0a0a12' },
        fpsLimit: 60,
        particles: {
          number: { value: 90, density: { enable: true, area: 900 } },
          color: { value: '#7dd3fc' },
          links: { enable: true, distance: 150, color: '#7dd3fc', opacity: 0.4, width: 1 },
          move: { enable: !reducedMotion, speed: 2 },
          size: { value: 2 }
        },
        interactivity: {
          events: { onHover: { enable: true, mode: 'grab' } },
          modes: { grab: { distance: 180, links: { opacity: 0.6 } } }
        },
        detectRetina: true
      },
      snow: {
        background: { color: 'transparent' },
        fpsLimit: 60,
        particles: {
          number: { value: 150, density: { enable: true, area: 900 } },
          color: { value: '#ffffff' },
          shape: { type: 'circle' },
          opacity: { value: { min: 0.4, max: 0.9 } },
          size: { value: { min: 1, max: 5 } },
          move: { enable: !reducedMotion, direction: 'bottom', speed: { min: 1, max: 3 }, straight: false, drift: 1 },
          links: { enable: false }
        },
        detectRetina: true
      },
      bubble: {
        background: { color: '#0f172a' },
        fpsLimit: 60,
        particles: {
          number: { value: 25, density: { enable: true, area: 900 } },
          color: { value: [ '#60a5fa', '#a78bfa', '#34d399' ] },
          shape: { type: 'circle' },
          opacity: { value: 0.25 },
          size: { value: { min: 20, max: 60 } },
          move: { enable: !reducedMotion, speed: 0.8, direction: 'top', random: true, straight: false },
          links: { enable: false },
          stroke: { width: 1, color: '#ffffff' }
        },
        detectRetina: true
      },
      galaxy: {
        background: { color: '#000010' },
        fpsLimit: 60,
        particles: {
          number: { value: 200, density: { enable: true, area: 900 } },
          color: { value: [ '#ffffff', '#93c5fd', '#fde68a' ] },
          opacity: { value: { min: 0.3, max: 1 } },
          size: { value: { min: 0.5, max: 2.5 } },
          move: { enable: !reducedMotion, speed: 0.15, random: true },
          links: { enable: false },
          twinkle: { particles: { enable: true, frequency: 0.05, opacity: 1 } }
        },
        detectRetina: true
      },
      neon: {
        background: { color: '#050014' },
        fpsLimit: 60,
        particles: {
          number: { value: 80, density: { enable: true, area: 900 } },
          color: { value: [ '#22d3ee', '#c084fc' ] },
          links: { enable: true, distance: 140, color: '#c084fc', opacity: 0.5, width: 1.2 },
          move: { enable: !reducedMotion, speed: 1.5 },
          size: { value: { min: 1, max: 3 } }
        },
        interactivity: {
          events: { onHover: { enable: true, mode: 'repulse' }, onClick: { enable: true, mode: 'push' } },
          modes: { repulse: { distance: 120 }, push: { quantity: 4 } }
        },
        detectRetina: true
      }
    };

    async function loadStyle (name) {
      const container = document.getElementById('tsparticles');
      container.classList.toggle('glow', name === 'neon');
      await tsParticles.load({ id: 'tsparticles', options: configs[ name ] });
    }

    document.getElementById('styleSelector').addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      loadStyle(btn.dataset.style);
    });

    document.addEventListener('visibilitychange', () => {
      const instance = tsParticles.domItem(0);
      if (!instance) return;
      if (document.hidden) instance.pause();
      else instance.play();
    });

    loadStyle('classic');
  </script>
</body>

</html>

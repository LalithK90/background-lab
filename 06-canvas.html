<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Lab — Canvas</title>
  <link rel="stylesheet" href="06-canvas.css" />
</head>

<body>

  <div id="background">
    <canvas id="stageCanvas"></canvas>
  </div>
  <div id="cursorSpotlight"></div>

  <nav class="navbar">
    <div class="nav-brand">Background Lab</div>
    <div class="nav-links">
      <a href="01-particles.html">Particles</a>
      <a href="02-aurora.html">Aurora</a>
      <a href="03-gradient.html">Gradient</a>
      <a href="04-waves.html">Waves</a>
      <a href="05-fluid.html">Fluid</a>
      <a href="06-canvas.html" class="active">Canvas</a>
      <a href="07-webgl.html">WebGL</a>
    </div>
  </nav>

  <main>
    <div class="content-card glass">
      <h1>Background Laboratory</h1>
      <p class="subtitle">Explore modern animated backgrounds</p>
      <p class="tag">Canvas • Vanilla JS</p>
      <button class="btn-demo">View Demo</button>
    </div>

    <div class="style-selector" id="styleSelector">
      <button class="style-btn active" data-style="flowfield">Flow Field</button>
      <button class="style-btn" data-style="trails">Particle Trails</button>
      <button class="style-btn" data-style="lines">Generative Lines</button>
      <button class="style-btn" data-style="noise">Noise Field</button>
      <button class="style-btn" data-style="interactive">Interactive Particles</button>
      <button class="style-btn" data-style="waves">Animated Waves</button>
    </div>
  </main>

  <script>
    (() => {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const canvas = document.getElementById('stageCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let width = 0, height = 0;
      let mouseX = 0, mouseY = 0, hasMouse = false;

      // Cursor spotlight glow + click ripple burst + glass card tilt
      const spotlightEl = document.getElementById('cursorSpotlight');
      window.addEventListener('mousemove', (e) => {
        spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
        spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
        spotlightEl.classList.add('visible');
      });
      window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

      document.addEventListener('click', (e) => {
        if (reducedMotion) return;
        const ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        ripple.style.left = `${e.clientX}px`;
        ripple.style.top = `${e.clientY}px`;
        document.body.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      });

      const tiltCard = document.querySelector('.content-card.glass');
      tiltCard.addEventListener('mousemove', (e) => {
        if (reducedMotion) return;
        const rect = tiltCard.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
      });
      tiltCard.addEventListener('mouseleave', () => {
        tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
      });

      // Subtle background parallax that follows the cursor
      const bgEl = document.getElementById('background');
      let parX = 0, parY = 0;
      function updateParallax () {
        const tx = (mouseX / window.innerWidth - 0.5) * -30;
        const ty = (mouseY / window.innerHeight - 0.5) * -30;
        parX += (tx - parX) * 0.06;
        parY += (ty - parY) * 0.06;
        bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      }

      function resize () {
        width = canvas.clientWidth;
        height = canvas.clientHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; hasMouse = true; });

      // simple pseudo-noise
      function noise2 (x, y) {
        return (Math.sin(x * 0.7 + y * 1.3) + Math.sin(x * 1.9 - y * 0.6) + Math.sin((x + y) * 0.4)) / 3;
      }

      const renderers = {
        flowfield: {
          particles: [],
          init () {
            this.particles = Array.from({ length: 220 }, () => ({ x: Math.random() * width, y: Math.random() * height }));
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
          },
          frame (t) {
            ctx.fillStyle = 'rgba(10, 10, 18, 0.06)';
            ctx.fillRect(0, 0, width, height);
            this.particles.forEach((p) => {
              const angle = noise2(p.x * 0.01, p.y * 0.01 + t * 0.0003) * Math.PI * 2;
              p.x += Math.cos(angle) * 1.2;
              p.y += Math.sin(angle) * 1.2;
              if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
              ctx.fillStyle = 'rgba(125, 211, 252, 0.7)';
              ctx.fillRect(p.x, p.y, 1.6, 1.6);
            });
          }
        },
        trails: {
          particles: [],
          init () {
            this.particles = Array.from({ length: 70 }, () => ({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 2.4,
              vy: (Math.random() - 0.5) * 2.4,
              hue: Math.random() * 60 + 260
            }));
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
          },
          frame () {
            ctx.fillStyle = 'rgba(10, 10, 18, 0.12)';
            ctx.fillRect(0, 0, width, height);
            this.particles.forEach((p) => {
              p.x += p.vx; p.y += p.vy;
              if (p.x < 0 || p.x > width) p.vx *= -1;
              if (p.y < 0 || p.y > height) p.vy *= -1;
              ctx.fillStyle = `hsla(${p.hue}, 85%, 65%, 0.9)`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        },
        lines: {
          strands: [],
          init () {
            this.strands = Array.from({ length: 26 }, () => this.makeStrand());
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
          },
          makeStrand () {
            return {
              x: Math.random() * width,
              y: Math.random() * height,
              angle: Math.random() * Math.PI * 2,
              life: 0,
              maxLife: 100 + Math.random() * 120,
              hue: 190 + Math.random() * 120
            };
          },
          frame () {
            ctx.fillStyle = 'rgba(10, 10, 18, 0.04)';
            ctx.fillRect(0, 0, width, height);
            this.strands.forEach((s, i) => {
              const nx = s.x + Math.cos(s.angle) * 2.2;
              const ny = s.y + Math.sin(s.angle) * 2.2;
              ctx.strokeStyle = `hsla(${s.hue}, 80%, 65%, 0.5)`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(s.x, s.y);
              ctx.lineTo(nx, ny);
              ctx.stroke();
              s.x = nx; s.y = ny;
              s.angle += (Math.random() - 0.5) * 0.5;
              s.life += 1;
              if (s.life > s.maxLife || s.x < 0 || s.x > width || s.y < 0 || s.y > height) {
                this.strands[ i ] = this.makeStrand();
              }
            });
          }
        },
        noise: {
          cell: 26,
          init () {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
          },
          frame (t) {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(196, 181, 253, 0.55)';
            ctx.lineWidth = 1.4;
            for (let x = 0; x < width; x += this.cell) {
              for (let y = 0; y < height; y += this.cell) {
                const angle = noise2(x * 0.02, y * 0.02 + t * 0.0002) * Math.PI;
                const len = this.cell * 0.4;
                const dx = Math.cos(angle) * len;
                const dy = Math.sin(angle) * len;
                ctx.beginPath();
                ctx.moveTo(x - dx, y - dy);
                ctx.lineTo(x + dx, y + dy);
                ctx.stroke();
              }
            }
          }
        },
        interactive: {
          particles: [],
          init () {
            this.particles = Array.from({ length: 110 }, () => ({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: 0,
              vy: 0,
              baseX: 0,
              baseY: 0
            }));
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
          },
          frame () {
            ctx.fillStyle = 'rgba(10, 10, 18, 0.18)';
            ctx.fillRect(0, 0, width, height);
            this.particles.forEach((p) => {
              let ax = 0, ay = 0;
              if (hasMouse) {
                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const dist = Math.max(Math.hypot(dx, dy), 1);
                if (dist < 140) {
                  const force = (140 - dist) / 140;
                  ax = (dx / dist) * force * 2.2;
                  ay = (dy / dist) * force * 2.2;
                }
              }
              p.vx = (p.vx + ax) * 0.9 + (Math.random() - 0.5) * 0.1;
              p.vy = (p.vy + ay) * 0.9 + (Math.random() - 0.5) * 0.1;
              p.x += p.vx; p.y += p.vy;
              if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
              ctx.fillStyle = 'rgba(34, 211, 238, 0.85)';
              ctx.beginPath();
              ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        },
        waves: {
          init () {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
          },
          frame (t) {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, width, height);
            const layers = [
              { amp: 26, freq: 0.008, speed: 0.0012, color: 'rgba(59, 130, 246, 0.6)', y: 0.5 },
              { amp: 18, freq: 0.012, speed: 0.0018, color: 'rgba(139, 92, 246, 0.6)', y: 0.62 },
              { amp: 12, freq: 0.016, speed: 0.0024, color: 'rgba(236, 72, 153, 0.6)', y: 0.74 }
            ];
            layers.forEach((layer) => {
              ctx.beginPath();
              for (let x = 0; x <= width; x += 6) {
                const y = height * layer.y + Math.sin(x * layer.freq + t * layer.speed) * layer.amp;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = layer.color;
              ctx.lineWidth = 2;
              ctx.stroke();
            });
          }
        }
      };

      let currentKey = 'flowfield';
      let rafId = null;

      function loop (t) {
        renderers[ currentKey ].frame(t);
        if (!reducedMotion) updateParallax();
        rafId = requestAnimationFrame(loop);
      }

      function start () {
        resize();
        renderers[ currentKey ].init();
        if (rafId) cancelAnimationFrame(rafId);
        if (reducedMotion) { renderers[ currentKey ].frame(0); return; }
        rafId = requestAnimationFrame(loop);
      }

      document.getElementById('styleSelector').addEventListener('click', (e) => {
        const btn = e.target.closest('.style-btn');
        if (!btn) return;
        document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentKey = btn.dataset.style;
        start();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
        else if (!rafId && !reducedMotion) { rafId = requestAnimationFrame(loop); }
      });

      start();
    })();
  </script>
</body>

</html>

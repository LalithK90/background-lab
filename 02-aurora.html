<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Lab — Aurora</title>
  <link rel="stylesheet" href="02-aurora.css" />
</head>

<body>

  <div id="background">
    <div id="auroraStage"></div>
  </div>
  <div id="cursorSpotlight"></div>

  <nav class="navbar">
    <div class="nav-brand">Background Lab</div>
    <div class="nav-links">
      <a href="01-particles.html">Particles</a>
      <a href="02-aurora.html" class="active">Aurora</a>
      <a href="03-gradient.html">Gradient</a>
      <a href="04-waves.html">Waves</a>
      <a href="05-fluid.html">Fluid</a>
      <a href="06-canvas.html">Canvas</a>
      <a href="07-webgl.html">WebGL</a>
    </div>
  </nav>

  <main>
    <div class="content-card glass">
      <h1>Background Laboratory</h1>
      <p class="subtitle">Explore modern animated backgrounds</p>
      <p class="tag">Aurora • CSS + Vanilla JS</p>
      <button class="btn-demo">View Demo</button>
    </div>

    <div class="style-selector" id="styleSelector">
      <button class="style-btn active" data-style="purple">Purple Aurora</button>
      <button class="style-btn" data-style="ocean">Ocean Aurora</button>
      <button class="style-btn" data-style="sunset">Sunset Aurora</button>
      <button class="style-btn" data-style="emerald">Emerald Aurora</button>
      <button class="style-btn" data-style="northern">Northern Lights</button>
      <button class="style-btn" data-style="neon">Neon Aurora</button>
      <button class="style-btn" data-style="solarFlare">Solar Flare</button>
      <button class="style-btn" data-style="deepSpaceNebula">Deep Space Nebula</button>
      <button class="style-btn" data-style="polarVortex">Polar Vortex</button>
      <button class="style-btn" data-style="cosmicDust">Cosmic Dust</button>
      <button class="style-btn" data-style="monochromeCyan">Monochrome Cyan</button>
      <button class="style-btn" data-style="auroraStars">Aurora + Stars</button>
      <button class="style-btn" data-style="crimsonSky">Crimson Sky</button>
      <button class="style-btn" data-style="goldenHour">Golden Hour</button>
      <button class="style-btn" data-style="arcticGlow">Arctic Glow</button>
      <button class="style-btn" data-style="midnightViolet">Midnight Violet</button>
      <button class="style-btn" data-style="electricTeal">Electric Teal</button>
      <button class="style-btn" data-style="roseQuartz">Rose Quartz</button>
      <button class="style-btn" data-style="amberWaves">Amber Waves</button>
      <button class="style-btn" data-style="glacierBlue">Glacier Blue</button>
      <button class="style-btn" data-style="volcanicGlow">Volcanic Glow</button>
      <button class="style-btn" data-style="twilightDrift">Twilight Drift</button>
      <button class="style-btn" data-style="opalShimmer">Opal Shimmer</button>
      <button class="style-btn" data-style="cherryBlossomSky">Cherry Blossom Sky</button>
      <button class="style-btn" data-style="stormCloud">Storm Cloud</button>
      <button class="style-btn" data-style="desertMirage">Desert Mirage</button>
      <button class="style-btn" data-style="coralReefGlow">Coral Reef Glow</button>
      <button class="style-btn" data-style="moonlitMist">Moonlit Mist</button>
      <button class="style-btn" data-style="copperHaze">Copper Haze</button>
      <button class="style-btn" data-style="jadeCurtain">Jade Curtain</button>
      <button class="style-btn" data-style="frostAurora">Frost Aurora</button>
      <button class="style-btn" data-style="solarEclipse">Solar Eclipse</button>
    </div>
  </main>

  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stage = document.getElementById('auroraStage');

    // Cursor spotlight glow + click ripple burst + glass card tilt
    const spotlightEl = document.getElementById('cursorSpotlight');
    window.addEventListener('mousemove', (e) => {
      spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
      spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
      spotlightEl.classList.add('visible');
    });
    window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

    document.addEventListener('click', (e) => {
      if (reducedMotion) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    const tiltCard = document.querySelector('.content-card.glass');
    tiltCard.addEventListener('mousemove', (e) => {
      if (reducedMotion) return;
      const rect = tiltCard.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
    });
    tiltCard.addEventListener('mouseleave', () => {
      tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // Subtle background parallax that follows the cursor
    const bgEl = document.getElementById('background');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let parX = 0, parY = 0, parallaxRAF = null;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    function parallaxLoop () {
      const tx = (mouseX / window.innerWidth - 0.5) * -30;
      const ty = (mouseY / window.innerHeight - 0.5) * -30;
      parX += (tx - parX) * 0.06;
      parY += (ty - parY) * 0.06;
      bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      parallaxRAF = requestAnimationFrame(parallaxLoop);
    }
    if (!reducedMotion) parallaxRAF = requestAnimationFrame(parallaxLoop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (parallaxRAF) { cancelAnimationFrame(parallaxRAF); parallaxRAF = null; } }
      else if (!parallaxRAF && !reducedMotion) { parallaxRAF = requestAnimationFrame(parallaxLoop); }
    });

    const styles = {
      purple: { colors: [ '#7c3aed', '#4c1d95', '#a78bfa' ], count: 4, duration: 18, blur: 80, motion: 'float' },
      ocean: { colors: [ '#0ea5e9', '#06b6d4', '#0f766e' ], count: 5, duration: 26, blur: 100, motion: 'drift' },
      sunset: { colors: [ '#f472b6', '#fb923c', '#a855f7' ], count: 4, duration: 12, blur: 70, motion: 'pulse' },
      emerald: { colors: [ '#10b981', '#22d3ee', '#1e3a8a' ], count: 3, duration: 32, blur: 110, motion: 'float' },
      northern: { colors: [ '#34d399', '#22d3ee', '#3b82f6' ], count: 6, duration: 20, blur: 90, motion: 'curtain' },
      neon: { colors: [ '#a855f7', '#ec4899', '#22d3ee' ], count: 5, duration: 9, blur: 60, motion: 'drift' },
      solarFlare: { colors: [ '#f97316', '#ef4444', '#fde047' ], count: 5, duration: 10, blur: 65, motion: 'pulse' },
      deepSpaceNebula: { colors: [ '#4c1d95', '#1e1b4b', '#0a0a12' ], count: 3, duration: 40, blur: 130, motion: 'float' },
      polarVortex: { colors: [ '#38bdf8', '#e0f2fe', '#0ea5e9' ], count: 5, duration: 16, blur: 85, motion: 'drift' },
      cosmicDust: { colors: [ '#f9a8d4', '#c4b5fd', '#93c5fd' ], count: 6, duration: 34, blur: 100, motion: 'float' },
      monochromeCyan: { colors: [ '#22d3ee', '#0891b2', '#a5f3fc' ], count: 4, duration: 22, blur: 90, motion: 'drift' },
      auroraStars: { colors: [ '#34d399', '#818cf8', '#f9fafb' ], count: 5, duration: 18, blur: 80, motion: 'curtain' },
      crimsonSky: { colors: [ '#dc2626', '#7f1d1d', '#f87171' ], count: 4, duration: 14, blur: 75, motion: 'pulse' },
      goldenHour: { colors: [ '#f59e0b', '#fbbf24', '#fde68a' ], count: 4, duration: 20, blur: 90, motion: 'float' },
      arcticGlow: { colors: [ '#bae6fd', '#e0f2fe', '#38bdf8' ], count: 5, duration: 24, blur: 95, motion: 'drift' },
      midnightViolet: { colors: [ '#312e81', '#4c1d95', '#1e1b4b' ], count: 4, duration: 30, blur: 105, motion: 'float' },
      electricTeal: { colors: [ '#2dd4bf', '#0d9488', '#5eead4' ], count: 5, duration: 12, blur: 70, motion: 'drift' },
      roseQuartz: { colors: [ '#fbcfe8', '#f9a8d4', '#f472b6' ], count: 4, duration: 26, blur: 95, motion: 'float' },
      amberWaves: { colors: [ '#f59e0b', '#d97706', '#fde68a' ], count: 4, duration: 18, blur: 80, motion: 'curtain' },
      glacierBlue: { colors: [ '#93c5fd', '#60a5fa', '#dbeafe' ], count: 5, duration: 28, blur: 100, motion: 'float' },
      volcanicGlow: { colors: [ '#ef4444', '#7c2d12', '#f97316' ], count: 4, duration: 10, blur: 65, motion: 'pulse' },
      twilightDrift: { colors: [ '#6366f1', '#a855f7', '#312e81' ], count: 5, duration: 24, blur: 95, motion: 'drift' },
      opalShimmer: { colors: [ '#f0abfc', '#a5f3fc', '#fef08a' ], count: 6, duration: 16, blur: 75, motion: 'pulse' },
      cherryBlossomSky: { colors: [ '#fbcfe8', '#fda4af', '#f9a8d4' ], count: 5, duration: 22, blur: 85, motion: 'float' },
      stormCloud: { colors: [ '#475569', '#1e293b', '#94a3b8' ], count: 4, duration: 20, blur: 100, motion: 'drift' },
      desertMirage: { colors: [ '#fbbf24', '#f97316', '#fde68a' ], count: 4, duration: 26, blur: 90, motion: 'float' },
      coralReefGlow: { colors: [ '#fb7185', '#22d3ee', '#f97316' ], count: 5, duration: 18, blur: 80, motion: 'curtain' },
      moonlitMist: { colors: [ '#cbd5e1', '#94a3b8', '#e2e8f0' ], count: 4, duration: 32, blur: 110, motion: 'float' },
      copperHaze: { colors: [ '#c2410c', '#ea580c', '#fdba74' ], count: 4, duration: 16, blur: 75, motion: 'pulse' },
      jadeCurtain: { colors: [ '#10b981', '#065f46', '#6ee7b7' ], count: 5, duration: 20, blur: 90, motion: 'curtain' },
      frostAurora: { colors: [ '#e0f2fe', '#bae6fd', '#a5f3fc' ], count: 5, duration: 24, blur: 90, motion: 'drift' },
      solarEclipse: { colors: [ '#0f172a', '#f97316', '#1e293b' ], count: 3, duration: 14, blur: 70, motion: 'pulse' }
    };

    function renderAurora (name) {
      const cfg = styles[ name ];
      stage.innerHTML = '';
      for (let i = 0; i < cfg.count; i++) {
        const blob = document.createElement('div');
        blob.className = `aurora-blob motion-${cfg.motion}`;
        const color = cfg.colors[ i % cfg.colors.length ];
        const size = 260 + Math.random() * 220;
        blob.style.setProperty('--blob-color', color);
        blob.style.setProperty('--blob-size', `${size}px`);
        blob.style.setProperty('--blob-blur', `${cfg.blur}px`);
        blob.style.setProperty('--blob-duration', reducedMotion ? '0s' : `${cfg.duration + i * 2}s`);
        blob.style.setProperty('--blob-delay', `${i * -3}s`);
        blob.style.left = `${Math.random() * 80}%`;
        blob.style.top = `${Math.random() * 70}%`;
        stage.appendChild(blob);
      }
    }

    document.getElementById('styleSelector').addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      renderAurora(btn.dataset.style);
    });

    document.addEventListener('visibilitychange', () => {
      stage.style.animationPlayState = document.hidden ? 'paused' : 'running';
      stage.querySelectorAll('.aurora-blob').forEach((b) => {
        b.style.animationPlayState = document.hidden ? 'paused' : 'running';
      });
    });

    renderAurora('purple');
  </script>
</body>

</html>

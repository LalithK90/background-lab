  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stage = document.getElementById('auroraStage');

    // Cursor spotlight glow + click ripple burst + glass card tilt
    const spotlightEl = document.getElementById('cursorSpotlight');
    window.addEventListener('mousemove', (e) => {
      spotlightEl.style.setProperty('--spot-x', `${e.clientX}px`);
      spotlightEl.style.setProperty('--spot-y', `${e.clientY}px`);
      spotlightEl.classList.add('visible');
    });
    window.addEventListener('mouseleave', () => spotlightEl.classList.remove('visible'));

    document.addEventListener('click', (e) => {
      if (reducedMotion) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    const tiltCard = document.querySelector('.content-card.glass');
    tiltCard.addEventListener('mousemove', (e) => {
      if (reducedMotion) return;
      const rect = tiltCard.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.transform = `rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg) translateY(-4px)`;
    });
    tiltCard.addEventListener('mouseleave', () => {
      tiltCard.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // Subtle background parallax that follows the cursor
    const bgEl = document.getElementById('background');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let parX = 0, parY = 0, parallaxRAF = null;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    function parallaxLoop () {
      const tx = (mouseX / window.innerWidth - 0.5) * -30;
      const ty = (mouseY / window.innerHeight - 0.5) * -30;
      parX += (tx - parX) * 0.06;
      parY += (ty - parY) * 0.06;
      bgEl.style.transform = `translate(${parX.toFixed(2)}px, ${parY.toFixed(2)}px)`;
      parallaxRAF = requestAnimationFrame(parallaxLoop);
    }
    if (!reducedMotion) parallaxRAF = requestAnimationFrame(parallaxLoop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (parallaxRAF) { cancelAnimationFrame(parallaxRAF); parallaxRAF = null; } }
      else if (!parallaxRAF && !reducedMotion) { parallaxRAF = requestAnimationFrame(parallaxLoop); }
    });

    const styles = {
      purple: { colors: [ '#7c3aed', '#4c1d95', '#a78bfa' ], count: 4, duration: 18, blur: 80, motion: 'float' },

      velvetNight: { colors: [ '#1e1b4b', '#312e81', '#0a0a12' ], count: 3, duration: 36, blur: 120, motion: 'float' },
      autumnEmber: { colors: [ '#b45309', '#d97706', '#7c2d12' ], count: 4, duration: 18, blur: 80, motion: 'curtain' },
      cyberAurora: { colors: [ '#22d3ee', '#a855f7', '#0a0a12' ], count: 5, duration: 11, blur: 65, motion: 'drift' },
      phantomGlow: { colors: [ '#94a3b8', '#e2e8f0', '#475569' ], count: 4, duration: 28, blur: 100, motion: 'float' },
      lavenderDream: { colors: [ '#c4b5fd', '#ddd6fe', '#a78bfa' ], count: 5, duration: 24, blur: 90, motion: 'pulse' },
      toxicGreen: { colors: [ '#84cc16', '#4ade80', '#065f46' ], count: 4, duration: 12, blur: 70, motion: 'drift' },
      emberSkyline: { colors: [ '#f97316', '#7c2d12', '#1e293b' ], count: 4, duration: 16, blur: 80, motion: 'curtain' },
      deepOceanTrench: { colors: [ '#083344', '#0e7490', '#082f49' ], count: 3, duration: 38, blur: 120, motion: 'float' },
      moltenCore: { colors: [ '#ef4444', '#f97316', '#facc15' ], count: 5, duration: 9, blur: 65, motion: 'pulse' },
      silverMist: { colors: [ '#e2e8f0', '#cbd5e1', '#f8fafc' ], count: 5, duration: 30, blur: 100, motion: 'drift' },
      radiantOrchid: { colors: [ '#d946ef', '#f0abfc', '#a21caf' ], count: 5, duration: 20, blur: 85, motion: 'pulse' },
      winterSolstice: { colors: [ '#93c5fd', '#e0f2fe', '#1e3a8a' ], count: 4, duration: 26, blur: 95, motion: 'float' },
      solarCorona: { colors: [ '#fde047', '#f97316', '#fff7ed' ], count: 5, duration: 10, blur: 70, motion: 'pulse' },
      galacticRibbon: { colors: [ '#6366f1', '#ec4899', '#22d3ee' ], count: 6, duration: 20, blur: 85, motion: 'curtain' },
      auroraPrism: { colors: [ '#f472b6', '#38bdf8', '#a3e635', '#facc15' ], count: 6, duration: 16, blur: 80, motion: 'drift' }
    };

    function renderAurora (name) {
      const cfg = styles[ name ];
      stage.innerHTML = '';
      for (let i = 0; i < cfg.count; i++) {
        const blob = document.createElement('div');
        blob.className = `aurora-blob motion-${cfg.motion}`;
        const color = cfg.colors[ i % cfg.colors.length ];
        const size = 260 + Math.random() * 220;
        blob.style.setProperty('--blob-color', color);
        blob.style.setProperty('--blob-size', `${size}px`);
        blob.style.setProperty('--blob-blur', `${cfg.blur}px`);
        blob.style.setProperty('--blob-duration', reducedMotion ? '0s' : `${cfg.duration + i * 2}s`);
        blob.style.setProperty('--blob-delay', `${i * -3}s`);
        blob.style.left = `${Math.random() * 80}%`;
        blob.style.top = `${Math.random() * 70}%`;
        stage.appendChild(blob);
      }
    }

    document.getElementById('styleSelector').addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      document.querySelectorAll('.style-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      renderAurora(btn.dataset.style);
    });

    document.addEventListener('visibilitychange', () => {
      stage.style.animationPlayState = document.hidden ? 'paused' : 'running';
      stage.querySelectorAll('.aurora-blob').forEach((b) => {
        b.style.animationPlayState = document.hidden ? 'paused' : 'running';
      });
    });

    renderAurora('purple');
  </script>
  <script>
    (() => {
      const cssFile = '02-aurora.css';
      const selector = document.getElementById('styleSelector');
      const drawer = document.getElementById('codeDrawer');
      const output = document.getElementById('generatedHtml');
      const status = document.getElementById('copyStatus');
      const tint = document.getElementById('customTint');
      const background = document.getElementById('background');
      const defaults = { tint: '#ffffff', mix: 0, speed: 1, brightness: 1 };
      const bounds = { mix: [ 0, 0.75 ], speed: [ 0.25, 2.5 ], brightness: [ 0.5, 1.5 ] };
      const validColor = (value) => /^#[0-9a-f]{6}$/i.test(value || '');
      const clamp = (value, key) => Math.min(bounds[ key ][ 1 ], Math.max(bounds[ key ][ 0 ], Number(value)));
      const initial = (() => { try { return JSON.parse(document.body.dataset.exportState || 'null'); } catch { return null; } })();
      let style = selector.querySelector('.style-btn.active').dataset.style;
      let settings = { ...defaults };
      let restoring = true;
      const requested = initial && selector.querySelector(`.style-btn[data-style="${CSS.escape(initial.style)}"]`);
      if (requested) requested.click();
      if (requested) style = requested.dataset.style;
      restoring = false;

      function applySettings () {
        tint.style.backgroundColor = settings.tint;
        tint.style.opacity = String(settings.mix);
        background.style.filter = settings.brightness === 1 ? '' : `brightness(${settings.brightness})`;
        window.BackgroundLabSpeed = settings.speed;
        document.getAnimations().forEach((animation) => {
          if (animation.effect && animation.effect.getTiming().iterations === Infinity) animation.playbackRate = settings.speed;
        });
        document.body.dataset.exportState = JSON.stringify({ schemaVersion: 1, style, settings });
      }

      function addControl (key, labelText, type, min, max, step) {
        const label = document.createElement('label');
        label.className = type === 'range' ? 'code-control code-control--range' : 'code-control';
        label.htmlFor = `drawer-${key}`;
        const title = document.createElement('span');
        title.textContent = labelText;
        const input = document.createElement('input');
        input.id = `drawer-${key}`;
        input.type = type;
        if (type === 'range') { input.min = min; input.max = max; input.step = step; }
        input.value = settings[ key ];
        if (type === 'range') {
          const value = document.createElement('output');
          value.htmlFor = input.id;
          value.value = Number(settings[ key ]).toFixed(2);
          title.append(' ', value);
          input.addEventListener('input', () => { settings[ key ] = clamp(input.value, key); value.value = Number(settings[ key ]).toFixed(2); applySettings(); refresh(); });
        } else {
          input.addEventListener('input', () => {
            if (!validColor(input.value)) return;
            settings[ key ] = input.value;
            if (key === 'tint' && settings.mix === 0) {
              settings.mix = 0.2;
              const strength = document.getElementById('drawer-mix');
              if (strength) { strength.value = '0.2'; strength.closest('label').querySelector('output').value = '0.20'; }
            }
            applySettings(); refresh();
          });
        }
        label.append(title, input);
        document.getElementById('parameterControls').appendChild(label);
      }

      function renderControls () {
        const controls = document.getElementById('parameterControls');
        controls.innerHTML = '';
        document.getElementById('selectedStyleName').textContent = selector.querySelector('.style-btn.active').textContent;
        addControl('tint', 'Color tint', 'color');
        addControl('mix', 'Tint strength', 'range', 0, 0.75, 0.01);
        addControl('speed', 'Animation speed', 'range', 0.25, 2.5, 0.05);
        addControl('brightness', 'Brightness', 'range', 0.5, 1.5, 0.05);
      }

      function inlinePageCss (clone) {
        const sheet = Array.from(document.styleSheets).find((item) => item.href ? item.href.endsWith(`/${cssFile}`) : item.ownerNode && item.ownerNode.dataset.exportedStyles === cssFile);
        if (!sheet) throw new Error('Page stylesheet not found.');
        const styleTag = document.createElement('style');
        styleTag.dataset.exportedStyles = cssFile;
        styleTag.textContent = Array.from(sheet.cssRules, (rule) => rule.cssText).join('\n');
        const link = clone.querySelector(`link[rel="stylesheet"][href$="${cssFile}"]`);
        const existingStyle = clone.querySelector(`style[data-exported-styles="${cssFile}"]`);
        if (link) link.replaceWith(styleTag); else if (existingStyle) existingStyle.replaceWith(styleTag); else clone.querySelector('head').appendChild(styleTag);
      }

      function buildHtml () {
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('body').dataset.exportState = JSON.stringify({ schemaVersion: 1, style, settings });
        clone.querySelector('#codeDrawer').removeAttribute('open');
        clone.querySelector('#openCodeDrawer').setAttribute('aria-expanded', 'false');
        clone.querySelector('#generatedHtml').textContent = '';
        clone.querySelector('#copyStatus').textContent = '';
        clone.querySelectorAll('.click-ripple').forEach((node) => node.remove());
        clone.querySelector('#cursorSpotlight').classList.remove('visible');
        inlinePageCss(clone);
        return `<!doctype html>\n${clone.outerHTML}`;
      }

      function refresh () {
        try { output.value = buildHtml(); status.textContent = ''; }
        catch (error) { output.value = ''; status.textContent = `Could not generate HTML: ${error.message}`; }
      }

      selector.addEventListener('click', (event) => {
        const button = event.target.closest('.style-btn');
        if (!button || restoring) return;
        style = button.dataset.style;
        settings = { ...defaults };
        renderControls(); applySettings();
        if (drawer.open) refresh();
      });

      document.getElementById('openCodeDrawer').addEventListener('click', () => {
        renderControls(); applySettings(); drawer.showModal();
        document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'true');
        document.getElementById('codeDrawerTitle').focus(); refresh();
      });
      const closeDrawer = () => { if (drawer.open) drawer.close(); document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false'); document.getElementById('openCodeDrawer').focus(); };
      document.getElementById('closeCodeDrawer').addEventListener('click', closeDrawer);
      drawer.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.preventDefault(); closeDrawer(); } });
      drawer.addEventListener('click', (event) => { if (event.target === drawer) closeDrawer(); });
      drawer.addEventListener('close', () => document.getElementById('openCodeDrawer').setAttribute('aria-expanded', 'false'));
      document.getElementById('copyFullHtml').addEventListener('click', async () => {
        refresh();
        if (!output.value) return;
        try { await navigator.clipboard.writeText(output.value); status.textContent = 'Full HTML copied.'; }
        catch { output.focus(); output.select(); status.textContent = 'Clipboard unavailable. The HTML is selected; copy it manually.'; }
      });

      settings = { ...defaults, ...(initial && initial.style === style ? initial.settings : {}) };
      if (!validColor(settings.tint)) settings.tint = defaults.tint;
      Object.keys(bounds).forEach((key) => { if (!Number.isFinite(Number(settings[ key ]))) settings[ key ] = defaults[ key ]; else settings[ key ] = clamp(settings[ key ], key); });
      renderControls(); applySettings();
    })();
  </script>
</body>
